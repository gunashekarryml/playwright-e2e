<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QA Release Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#f5f6fa;--surface:#fff;--surface-solid:#fff;--surface-2:#f0f2f8;--border:#e3e6ef;
  --text:#0f1629;--text-dim:#4a5470;--text-faint:#7b85a0;
  --brand:#5b5bf0;--brand-2:#9a6bff;--brand-soft:#ececff;
  --good:#12805c;--good-soft:#dcf5ea;--warn:#a15c07;--warn-soft:#fdf0d5;--bad:#c42b3a;--bad-soft:#fde3e5;
  --shadow:0 1px 2px rgba(15,22,41,.05),0 8px 24px rgba(15,22,41,.05);
  --sans:'Inter',system-ui,-apple-system,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1020;--surface:#131a2f;--surface-solid:#131a2f;--surface-2:#1a2340;--border:#26304f;
  --text:#eef1fb;--text-dim:#aab3d0;--text-faint:#7782a6;
  --brand:#8b8bff;--brand-2:#c084fc;--brand-soft:#24294f;
  --good:#3ecf9a;--good-soft:#11322a;--warn:#f2b94b;--warn-soft:#38300f;--bad:#ff7380;--bad-soft:#3a1a22;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0b1020;--surface:#131a2f;--surface-solid:#131a2f;--surface-2:#1a2340;--border:#26304f;
  --text:#eef1fb;--text-dim:#aab3d0;--text-faint:#7782a6;
  --brand:#8b8bff;--brand-2:#c084fc;--brand-soft:#24294f;
  --good:#3ecf9a;--good-soft:#11322a;--warn:#f2b94b;--warn-soft:#38300f;--bad:#ff7380;--bad-soft:#3a1a22;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 72px}
a{color:var(--brand);text-decoration:none}a:hover{text-decoration:underline}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;color:#fff;font-weight:800;box-shadow:0 6px 16px rgba(91,91,240,.35)}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand small{display:block;color:var(--text-faint);font-size:12px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--text-dim)}
.live{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:var(--surface);border:1px solid var(--border);backdrop-filter:blur(10px)}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 var(--good);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:6px 12px;font:500 12.5px var(--sans);cursor:pointer;transition:.15s}
.btn:hover{transform:translateY(-1px);border-color:var(--brand);text-decoration:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);padding:22px;animation:rise .5s both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.card h2{margin:0 0 2px;font-size:15px;font-weight:650;letter-spacing:-.01em}
.card .sub{color:var(--text-faint);font-size:12.5px;margin:0 0 16px}
.grid{display:grid;gap:16px;margin-bottom:16px}
.g-hero{grid-template-columns:1.5fr 1fr}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(176px,1fr))}
.g-2{grid-template-columns:1.6fr 1fr}
.g-eq{grid-template-columns:1fr 1fr}
@media(max-width:900px){.g-hero,.g-2,.g-eq{grid-template-columns:1fr}}
.grad{background:linear-gradient(120deg,var(--brand),var(--brand-2));-webkit-background-clip:text;background-clip:text;color:transparent}

/* hero */
.verdict{display:flex;gap:20px;align-items:flex-start;position:relative;overflow:hidden}
.verdict.good{--vc:var(--good)}.verdict.warn{--vc:var(--warn)}.verdict.bad{--vc:var(--bad)}
.v-badge{flex:none;border-radius:18px;padding:16px 16px;text-align:center;min-width:118px}
.v-badge .v-ic{font-size:30px;line-height:1;font-weight:700}
.v-badge .v-t{font-weight:800;font-size:14px;margin-top:8px;letter-spacing:.06em}
.v-good{background:var(--good-soft);color:var(--good)}.v-warn{background:var(--warn-soft);color:var(--warn)}.v-bad{background:var(--bad-soft);color:var(--bad)}
.v-body{position:relative;z-index:1}
.v-body h2{font-size:22px;margin-bottom:6px;letter-spacing:-.02em}
.v-body p{margin:0 0 14px;color:var(--text-dim)}
.gates{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
@media(max-width:620px){.gates{grid-template-columns:1fr}.verdict{flex-direction:column}}
.gate{display:flex;gap:9px;align-items:flex-start;font-size:13px}
.gate i{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;margin-top:1px}
.gate .ok{background:var(--good-soft);color:var(--good)}.gate .wn{background:var(--warn-soft);color:var(--warn)}.gate .no{background:var(--bad-soft);color:var(--bad)}
.gate span{color:var(--text-faint);display:block;font-size:12px}
.score{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring{position:relative;width:178px;height:178px}
.ring svg{transform:rotate(-90deg)}
.ring .arc{transition:stroke-dasharray 1.2s cubic-bezier(.2,.8,.2,1)}
.ring .n{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .n b{font-size:46px;font-weight:800;letter-spacing:-.04em;line-height:1}
.ring .n small{color:var(--text-faint);font-size:12px;margin-top:4px}
.score .cap{margin-top:12px;color:var(--text-dim);font-size:12.5px;max-width:270px}

/* kpi */
.kpi{padding:18px;transition:.2s}.kpi:hover{transform:translateY(-3px)}
.kpi .l{color:var(--text-faint);font-size:12px;font-weight:500;margin-bottom:6px}
.kpi .v{font-size:30px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .d{font-size:12px;margin-top:6px;color:var(--text-faint)}
.kpi .d.up{color:var(--good)}.kpi .d.dn{color:var(--bad)}
.kpi svg{display:block;margin-top:10px;width:100%;height:32px}

.pill{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:11.5px;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.mute{background:var(--surface-2);color:var(--text-faint)}.pill.brand{background:var(--brand-soft);color:var(--brand)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:90px}
.bar>div{height:100%;border-radius:99px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.c-good{color:var(--good)}.c-warn{color:var(--warn)}.c-bad{color:var(--bad)}.c-faint{color:var(--text-faint)}
.bg-good{background:linear-gradient(90deg,var(--good),#6ee7b7)}.bg-warn{background:linear-gradient(90deg,var(--warn),#fde68a)}.bg-bad{background:linear-gradient(90deg,var(--bad),#fda4af)}
.num{font-variant-numeric:tabular-nums}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--text-dim);font:500 12.5px var(--sans);padding:5px 12px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface-solid);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px}

.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.feat{border:1px solid var(--border);border-radius:16px;padding:16px;background:var(--surface-2);cursor:pointer;transition:.2s;text-align:left;font:inherit;color:inherit;width:100%}
.feat:hover,.feat:focus-visible{transform:translateY(-3px);border-color:var(--brand);outline:0;box-shadow:0 10px 26px rgba(91,91,240,.2)}
.feat .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.feat b{font-weight:650}
.feat .big{font-size:28px;font-weight:800;letter-spacing:-.03em;margin-bottom:8px}
.feat .meta{display:flex;justify-content:space-between;color:var(--text-faint);font-size:12px;margin-top:8px}
.feat .more{color:var(--brand);font-size:12px;margin-top:10px;font-weight:600}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--text-faint);font-weight:500;font-size:12px;padding:0 12px 10px 0;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 12px 11px 0;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.mono{font-family:var(--mono);font-size:12px}
.item{padding:12px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.item:last-child{border:0;padding-bottom:0}.item:first-of-type{padding-top:0}
.item .t{font-weight:550}.item .s{color:var(--text-faint);font-size:12px;word-break:break-word}
.empty{color:var(--text-faint);padding:18px;background:var(--surface-2);border-radius:12px;text-align:center}
.legend{display:flex;gap:16px;font-size:12px;color:var(--text-dim);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--text-faint);font:11px var(--sans)}
.chart circle{transition:r .15s}.chart circle:hover{r:7}
.tip{position:fixed;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;padding:6px 10px;border-radius:8px;opacity:0;transition:opacity .1s;z-index:30;white-space:nowrap}
.chg{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.chg:last-child{border:0}.chg .tag{flex:none;margin-top:1px}
.dots{display:inline-flex;gap:4px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dot.expected{background:var(--good)}.dot.flaky{background:var(--warn)}.dot.unexpected{background:var(--bad)}.dot.skipped{background:var(--text-faint);opacity:.5}.dot.none{background:transparent;border:1px dashed var(--text-faint)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11.5px;padding:2px 8px;border-radius:8px;background:var(--surface-2);color:var(--text-dim)}
details.run>summary{list-style:none;cursor:pointer}details.run>summary::-webkit-details-marker{display:none}
.runrow{display:grid;grid-template-columns:70px 1.1fr 1fr 90px 90px 80px 84px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.runrow:hover{background:var(--surface-2)}
@media(max-width:820px){.runrow{grid-template-columns:60px 1fr 80px 70px}.runrow>:nth-child(3),.runrow>:nth-child(5),.runrow>:nth-child(6){display:none}}
.rundet{padding:4px 0 16px 70px}
@media(max-width:820px){.rundet{padding-left:0}}
/* modal */
dialog{border:1px solid var(--border);border-radius:22px;background:var(--surface-solid);color:var(--text);padding:0;width:min(780px,94vw);max-height:86vh;box-shadow:0 30px 80px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(5,8,22,.6);backdrop-filter:blur(4px)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:20px 22px 12px;position:sticky;top:0;background:var(--surface-solid);z-index:1}
.dlg-b{padding:0 22px 22px;overflow:auto;max-height:calc(86vh - 70px)}
details.gdet{margin-top:14px}details.gdet>summary{cursor:pointer;color:var(--brand);font-weight:600;font-size:12.5px;list-style:none}details.gdet>summary::-webkit-details-marker{display:none}
details.gdet .gates{margin-top:12px}
.brief{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:2px 0 4px}
@media(max-width:700px){.brief{grid-template-columns:1fr}}
.bf{border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--surface-2)}
.bf .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);font-weight:600}
.bf .x{font-weight:650;margin-top:2px}.bf .y{font-size:12px;color:var(--text-dim)}
.next{margin-top:12px;padding:10px 12px;border-radius:12px;font-size:13px;font-weight:550}
.next.good{background:var(--good-soft);color:var(--good)}.next.warn{background:var(--warn-soft);color:var(--warn)}.next.bad{background:var(--bad-soft);color:var(--bad)}
.sev{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:6px}
.sev.critical{background:var(--bad-soft);color:var(--bad)}.sev.high{background:var(--warn-soft);color:var(--warn)}.sev.medium{background:var(--brand-soft);color:var(--brand)}.sev.low{background:var(--surface-2);color:var(--text-dim)}
.deltas{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:14px}
.dl{border:1px solid var(--border);border-radius:12px;padding:8px 10px;background:var(--surface-2)}
.dl .k{font-size:11px;color:var(--text-faint)}.dl .x{font-weight:700;font-size:15px}.dl .y{font-size:11.5px}
.chg-h{display:flex;justify-content:space-between;font-size:12px;font-weight:650;color:var(--text-dim);margin:14px 0 2px;text-transform:uppercase;letter-spacing:.05em}
footer{margin-top:28px;text-align:center;color:var(--text-faint);font-size:12px}
@media print{.actions .btn,.seg{display:none}body{background:#fff}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== flat dark theme (neutral charcoal, blue accent). Remove this block to revert. ===== */
:root{--bg:#f4f4f5;--surface:#fff;--surface-solid:#fff;--surface-2:#f4f4f5;--border:#e4e4e7;
  --text:#18181b;--text-dim:#52525b;--text-faint:#71717a;--brand:#2563eb;--brand-2:#3b82f6;--brand-soft:#dbeafe;
  --good:#15803d;--good-soft:#dcfce7;--warn:#b45309;--warn-soft:#fef3c7;--bad:#b91c1c;--bad-soft:#fee2e2;--shadow:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f10;--surface:#181819;--surface-solid:#181819;--surface-2:#202022;--border:#2b2b2e;
  --text:#f4f4f5;--text-dim:#b4b4ba;--text-faint:#85858c;
  --brand:#3b82f6;--brand-2:#60a5fa;--brand-soft:#172554;
  --good:#34d399;--good-soft:#11302a;--warn:#f5a524;--warn-soft:#3a2c0d;--bad:#f0616d;--bad-soft:#3b1a1d;
  --shadow:none;color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#0f0f10;--surface:#181819;--surface-solid:#181819;--surface-2:#202022;--border:#2b2b2e;
  --text:#f4f4f5;--text-dim:#b4b4ba;--text-faint:#85858c;
  --brand:#3b82f6;--brand-2:#60a5fa;--brand-soft:#172554;
  --good:#34d399;--good-soft:#11302a;--warn:#f5a524;--warn-soft:#3a2c0d;--bad:#f0616d;--bad-soft:#3b1a1d;
  --shadow:none;color-scheme:dark;}
.wrap{max-width:none;width:100%;padding:28px clamp(16px,2.2vw,40px) 64px}
.top{margin-bottom:20px}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#14b8a6,#3b82f6);box-shadow:none}
h1{font-size:19px;font-weight:700;letter-spacing:-.015em}
.live{background:var(--surface);border-radius:8px;backdrop-filter:none}
.btn{border-radius:8px;background:var(--surface);padding:6px 12px}
.btn:hover{transform:none;border-color:var(--text-faint)}
.card{border-radius:14px;padding:20px;box-shadow:none;animation:none}
.card h2{font-size:14.5px;font-weight:700}
.card .sub{font-size:12.5px;margin-bottom:14px}
.grid{gap:14px;margin-bottom:14px}
.kpi{padding:16px 18px}.kpi:hover{transform:none;border-color:var(--text-faint)}
.kpi .l{font-size:12.5px;font-weight:500;color:var(--text-dim)}
.kpi .v{font-size:28px;font-weight:700}
.kpi svg polyline{stroke:var(--brand)}
.v-badge{border-radius:12px}
.v-body h2{font-size:20px}
.bf,.dl,.feat{border-radius:12px;background:var(--surface-2)}
.feat:hover,.feat:focus-visible{transform:none;box-shadow:none;border-color:var(--brand)}
.pill,.sev,.chip{border-radius:6px}
.seg{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:3px}
.seg button{border-radius:7px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--text);box-shadow:none}
.bar{height:9px;border-radius:99px;background:var(--surface-2)}
.bg-good{background:var(--brand)}.bg-warn{background:var(--warn)}.bg-bad{background:var(--bad)}
th{font-size:12px;font-weight:600;color:var(--text-faint);padding-bottom:12px}
td{padding:13px 12px 13px 0}
.runrow:hover{background:transparent}
dialog{border-radius:16px;box-shadow:0 24px 64px rgba(0,0,0,.5)}
.chart text{fill:var(--text-faint)}

/* hover effects (flat style: border + glow + small lift; remove this block to revert) */
@media (hover:hover){
  .card,.kpi,.feat,.bf,.dl,.btn,.chip,.pill,.gate,.item,.chg,.runrow,tbody tr td,.seg button,.logo,.ring,.v-badge,.bar>div,.kpi svg polyline{
    transition:transform .18s ease,border-color .18s ease,box-shadow .2s ease,background-color .18s ease,color .18s ease,filter .2s ease,stroke-width .18s ease}
  .card:hover{border-color:color-mix(in srgb,var(--brand) 45%,var(--border));box-shadow:0 8px 28px -10px color-mix(in srgb,var(--brand) 40%,transparent)}
  .kpi{position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--brand);transform:scaleX(0);transform-origin:0 50%;transition:transform .3s ease}
  .kpi:hover{transform:translateY(-3px);border-color:var(--brand);box-shadow:0 12px 28px -12px color-mix(in srgb,var(--brand) 55%,transparent)}
  .kpi:hover::before{transform:scaleX(1)}
  .kpi:hover svg polyline{stroke-width:3;filter:drop-shadow(0 0 4px var(--brand))}
  .feat:hover,.feat:focus-visible{transform:translateY(-3px);border-color:var(--brand);box-shadow:0 0 0 1px var(--brand),0 14px 30px -14px color-mix(in srgb,var(--brand) 60%,transparent)}
  .feat:hover .bar>div{filter:brightness(1.15)}
  .feat:hover .more,.feat:hover .big{letter-spacing:0}
  .feat .more{display:inline-block;transition:transform .18s ease}.feat:hover .more{transform:translateX(4px)}
  .btn:hover{background:var(--surface-2);border-color:var(--brand);transform:translateY(-1px);box-shadow:0 6px 16px -8px color-mix(in srgb,var(--brand) 55%,transparent)}
  .btn:active{transform:translateY(0) scale(.97)}
  .seg button:hover:not([aria-pressed="true"]){background:var(--surface-2);color:var(--text)}
  .bf:hover,.dl:hover,.chip:hover{border-color:color-mix(in srgb,var(--brand) 50%,var(--border));background:color-mix(in srgb,var(--brand) 8%,var(--surface-2));transform:translateY(-1px)}
  .gate:hover{transform:translateX(3px)}
  .pill:hover,.sev:hover{filter:brightness(1.2);transform:translateY(-1px)}
  .logo:hover{transform:rotate(-6deg) scale(1.06)}
  .ring:hover{transform:scale(1.04)}.ring:hover svg{filter:drop-shadow(0 0 12px color-mix(in srgb,var(--brand) 55%,transparent))}
  .v-badge:hover{transform:scale(1.04)}
  .bar:hover>div{filter:brightness(1.2)}
  tbody tr:hover td{background:color-mix(in srgb,var(--brand) 7%,transparent)}
  tbody tr:hover td:first-child{border-top-left-radius:8px;border-bottom-left-radius:8px;box-shadow:inset 2px 0 0 var(--brand);padding-left:8px}
  tbody tr:hover td:last-child{border-top-right-radius:8px;border-bottom-right-radius:8px}
  .runrow:hover{background:color-mix(in srgb,var(--brand) 7%,transparent);border-radius:8px;padding-left:10px;padding-right:10px}
  .item:hover,.chg:hover{background:color-mix(in srgb,var(--brand) 6%,transparent);border-radius:8px;padding-left:8px;padding-right:8px}
  a:not(.btn){background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .25s ease}
  a:not(.btn):hover{text-decoration:none;background-size:100% 1px}
  details.gdet>summary:hover,details.run>summary:hover b{color:var(--text)}
  .chart circle:hover{filter:drop-shadow(0 0 6px var(--brand))}
}
.btn:focus-visible,.feat:focus-visible,.seg button:focus-visible,summary:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ===== v2: toolbar, heatmap, matrix, explorer, skeleton, toast, print brief ===== */
.toolbar{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
.toolbar .tb-note{color:var(--text-faint);font-size:12.5px}
.toolbar .hint{margin-left:auto;color:var(--text-faint);font-size:12px}
kbd{font:600 11px var(--mono);background:var(--surface-2);border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--text-dim)}
.fresh{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:8px;background:var(--surface);border:1px solid var(--border);font-size:12.5px}
.fresh::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.fresh-good{--c:var(--good)}.fresh-warn{--c:var(--warn)}.fresh-bad{--c:var(--bad)}
.muted-sm{color:var(--text-faint);font-size:12.5px}
.link{background:none;border:0;padding:0;color:inherit;font:inherit;font-weight:550;text-align:left;cursor:pointer}
.link:hover{color:var(--brand)}
.clickable{cursor:pointer;border-radius:8px}.clickable:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.filters input,.filters select{background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 10px;font:500 13px var(--sans)}
.filters input{flex:1 1 220px;min-width:180px}
.filters input:focus,.filters select:focus{outline:2px solid var(--brand);outline-offset:1px}
.exp-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--text-faint);font-size:12.5px}

/* heatmap */
.hm-scroll{overflow-x:auto;padding-bottom:4px}
.hm-row{display:flex;align-items:center;gap:12px;padding:3px 0;min-width:max-content}
.hm-name{flex:0 0 340px;max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.hm-cells{display:flex;gap:3px}
.hm{width:15px;height:22px;border:0;padding:0;border-radius:4px;cursor:pointer;background:var(--surface-2)}
.hm-expected{background:color-mix(in srgb,var(--good) 70%,transparent)}.hm-flaky{background:var(--warn)}.hm-unexpected{background:var(--bad)}.hm-skipped{background:var(--text-faint);opacity:.45}.hm-none{background:var(--surface-2);border:1px dashed var(--border)}
.hm:hover{transform:scale(1.25);position:relative;z-index:2}
.hm-axis{display:flex;justify-content:space-between;color:var(--text-faint);font-size:11.5px;margin:6px 0 0 352px;min-width:max-content}

/* browser matrix */
.mx{display:grid;gap:6px;align-items:center;font-size:13px}
.mx-h{color:var(--text-faint);font-size:12px;font-weight:600;text-align:center}
.mx-r{font-weight:600}
.mx-c{text-align:center;padding:10px 6px;border-radius:10px;font-weight:700;font-variant-numeric:tabular-nums}
.mx-c.t-good{background:var(--good-soft);color:var(--good)}.mx-c.t-warn{background:var(--warn-soft);color:var(--warn)}.mx-c.t-bad{background:var(--bad-soft);color:var(--bad)}.mx-c.t-mute{background:var(--surface-2);color:var(--text-faint)}
.mx-c.weak{outline:2px solid currentColor;outline-offset:1px}

/* failure causes */
.legend i.sq{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.cause{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:6px;background:var(--surface-2)}
.cause::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.errbox{font:12px/1.5 var(--mono);background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;white-space:pre-wrap;word-break:break-word;color:var(--text-dim)}
.dlg-sec{margin:16px 0 8px;font-size:12px;font-weight:650;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em}
.short li{margin:6px 0}.short{padding-left:0;list-style:none}

/* skeleton, toast */
.skel{display:grid;gap:14px}.skel div{border-radius:14px;background:linear-gradient(90deg,var(--surface) 25%,var(--surface-2) 50%,var(--surface) 75%);background-size:200% 100%;animation:skel 1.4s infinite linear;border:1px solid var(--border)}
@keyframes skel{to{background-position:-200% 0}}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:550;opacity:0;pointer-events:none;transition:.25s;z-index:80}
#toast.show{opacity:1;transform:translate(-50%,0)}
.print-only{display:none}

.grid>*{min-width:0}.item>div:first-child{min-width:0;flex:1}.item .pill{flex:none}.item .s,.item .t{overflow-wrap:anywhere}.mx-h{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* filters: env counts, custom dates, period summary */
.seg{flex-wrap:wrap}.seg button.nodata{opacity:.5}.seg button.nodata[aria-pressed="true"]{opacity:.85}
.daterange{display:inline-flex;align-items:center;gap:8px}
.daterange input{background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:5px 8px;font:500 12.5px var(--sans)}
.daterange input:focus{outline:2px solid var(--brand);outline-offset:1px}
.tb-summary{margin:-4px 0 16px;color:var(--text-dim);font-size:13px}.tb-summary b{font-weight:650}
/* mobile pass */
@media(max-width:700px){
  .mx{font-size:12px;gap:4px}.mx-h{font-size:10.5px}.mx-c{padding:8px 2px}
  .wrap{padding:16px 12px 48px!important}
  .actions{width:100%;justify-content:flex-start}.actions .muted-sm{display:none}
  .toolbar .hint{display:none}.daterange{width:100%}.daterange input{flex:1}
  .hm-name{flex-basis:170px;max-width:170px}.hm-axis{margin-left:182px}
  dialog{width:96vw;border-radius:14px}
  .g-kpi{grid-template-columns:repeat(2,1fr)}
  .v-body h2{font-size:18px}
  .filters input{flex-basis:100%}
}
/* printable release brief: only the key sections, on a light theme */
@media print{
  body.print-brief::before{display:none}
  body.print-brief .wrap>*:not([data-print]){display:none!important}
  body.print-brief .print-only{display:block;margin-bottom:12px}
  body.print-brief .top .actions,body.print-brief .toolbar{display:none!important}
  body.print-brief .card{break-inside:avoid;box-shadow:none}
}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="skel" aria-busy="true" aria-label="Loading dashboard"><div style="height:56px"></div><div style="height:260px"></div><div style="height:130px"></div><div style="height:240px"></div></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div class="tip" id="tip"></div>
<dialog id="dlg"><div class="dlg-h"><h2 id="dlg-t" style="margin:0;font-size:18px"></h2><button class="btn" id="dlg-x">Close ✕</button></div><div class="dlg-b" id="dlg-b"></div></dialog>
<script>
/* ---- Release gates & thresholds: edit these to match your release policy ---- */
const POLICY = {
  regression: { pass: 98, warn: 90 },   // % pass rate of latest full regression
  flake:      { pass: 2,  warn: 5 },    // % of tests that needed a retry
  feature:    { pass: 90, warn: 75 },   // lowest feature pass rate
  browser:    { pass: 95, warn: 90 },   // lowest browser/device pass rate
  failures:   { warn: 3 },              // >0 = conditional, > this = blocked
  severity:   { critical: { pass: 100, warn: 90 }, high: { pass: 98, warn: 90 }, medium: { pass: 95, warn: 85 }, low: { pass: 90, warn: 80 } },
  drop:       3                         // pts drop vs previous full run that triggers a warning
};
const FEATURE_NAMES = { login: 'Login & Authentication', cart: 'Shopping Cart', checkout: 'Checkout & Payment', accessibility: 'Accessibility (WCAG)' };
const BROWSER_NAMES = { chromium: 'Chrome (desktop)', firefox: 'Firefox (desktop)', webkit: 'Safari (desktop)', 'mobile-chrome': 'Chrome (Android phone)' };
const SEVS = ['critical', 'high', 'medium', 'low'];
const sevPill = (k) => `<span class="sev ${esc(k)}">${esc(k)}</span>`;
const ALLURE_URL = '../';

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nice = (k) => FEATURE_NAMES[k] ?? k.replace(/[-_]/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());
const niceB = (k) => BROWSER_NAMES[k] ?? k;
const blank = { total: 0, passed: 0, failed: 0, flaky: 0, skipped: 0 };
const ran = (b) => b.total - b.skipped;
const rate = (b) => (ran(b) ? Math.round(((b.passed + b.flaky) / ran(b)) * 1000) / 10 : null);
const tone = (p, t = { pass: 95, warn: 85 }) => (p === null ? 'mute' : p >= t.pass ? 'good' : p >= t.warn ? 'warn' : 'bad');
const TXT = { good: 'Healthy', warn: 'Needs attention', bad: 'At risk', mute: 'Not run' };
const pct = (n) => (n === null ? '–' : `${n}%`);
const dur = (ms) => { const s = Math.round(ms / 1000); return s >= 60 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${s}s`; };
const when = (d) => new Date(d).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
const flakeRate = (r) => (ran(r) ? Math.round((r.flaky / ran(r)) * 1000) / 10 : 0);
const smokeOf = (r) => r.smoke ?? blank;
const isFull = (r) => (r.scope ? r.scope === 'full' : true);

function healthScore(r, fullRun) {
  const reg = rate(fullRun ?? r) ?? 0, sm = rate(smokeOf(r)) ?? reg;
  return Math.max(0, Math.round(reg * 0.5 + sm * 0.25 + (100 - Math.min(100, flakeRate(r) * 5)) * 0.25));
}

function spark(vals, color) {
  const v = vals.filter((x) => x !== null && x !== undefined);
  if (v.length < 2) return '';
  const min = Math.min(...v), max = Math.max(...v), span = max - min || 1;
  const pts = v.map((y, i) => `${(i / (v.length - 1)) * 100},${26 - ((y - min) / span) * 22}`).join(' ');
  return `<svg viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--${color})" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
const dlt = (cur, prev, unit = '', goodUp = true) => {
  if (prev === null || prev === undefined || cur === null) return '<div class="d">First data point</div>';
  const d = Math.round((cur - prev) * 10) / 10;
  if (!d) return '<div class="d">No change vs previous</div>';
  return `<div class="d ${(d > 0) === goodUp ? 'up' : 'dn'}">${d > 0 ? '▲' : '▼'} ${Math.abs(d)}${unit} vs previous</div>`;
};

/* ---- release readiness ---- */
function readiness(runs) {
  const latest = runs[0];
  const full = runs.find(isFull) ?? latest;
  const prevFull = runs.filter(isFull).find((r) => r !== full);
  const gates = [];
  const g = (name, status, detail) => gates.push({ name, status, detail });

  const sm = smokeOf(latest), smr = rate(sm);
  if (smr === null) g('Smoke tests (critical journeys)', 'wn', 'No smoke tests in latest run');
  else if (sm.failed) g('Smoke tests (critical journeys)', 'no', `${sm.failed} of ${ran(sm)} critical checks failing`);
  else g('Smoke tests (critical journeys)', 'ok', `All ${ran(sm)} critical checks pass`);

  const rr = rate(full);
  g('Regression pass rate', rr >= POLICY.regression.pass ? 'ok' : rr >= POLICY.regression.warn ? 'wn' : 'no',
    `${pct(rr)} of ${ran(full)} checks (target ≥ ${POLICY.regression.pass}%)${isFull(full) ? '' : ' – no full regression run yet'}`);

  g('Open failures', !full.failed ? 'ok' : full.failed <= POLICY.failures.warn ? 'wn' : 'no',
    full.failed ? `${full.failed} failing check${full.failed > 1 ? 's' : ''}` : 'No failing checks');

  if (full.severity) {
    const c = full.severity.critical, h = full.severity.high;
    g('Critical & high severity', c.failed ? 'no' : h.failed ? 'wn' : 'ok',
      c.failed ? `${c.failed} critical check${c.failed > 1 ? 's' : ''} failing` : h.failed ? `${h.failed} high-severity check${h.failed > 1 ? 's' : ''} failing` : 'No critical or high-severity failures');
  }

  const fr = flakeRate(full);
  g('Test stability', fr <= POLICY.flake.pass ? 'ok' : fr <= POLICY.flake.warn ? 'wn' : 'no', `${fr}% of checks needed a retry (target ≤ ${POLICY.flake.pass}%)`);

  const fe = Object.entries(full.features).map(([k, b]) => [k, rate(b)]).filter(([, p]) => p !== null).sort((a, b) => a[1] - b[1]);
  if (fe.length) g('Every feature healthy', fe[0][1] >= POLICY.feature.pass ? 'ok' : fe[0][1] >= POLICY.feature.warn ? 'wn' : 'no',
    fe[0][1] >= POLICY.feature.pass ? `Lowest: ${nice(fe[0][0])} at ${fe[0][1]}%` : `${nice(fe[0][0])} is at ${fe[0][1]}%`);

  const br = Object.entries(full.projects).map(([k, b]) => [k, rate(b)]).filter(([, p]) => p !== null).sort((a, b) => a[1] - b[1]);
  if (br.length) g('Cross-browser & mobile', br[0][1] >= POLICY.browser.pass ? 'ok' : br[0][1] >= POLICY.browser.warn ? 'wn' : 'no',
    br[0][1] >= POLICY.browser.pass ? `${br.length} platforms, lowest ${br[0][1]}%` : `${niceB(br[0][0])} is at ${br[0][1]}%`);

  if (prevFull) {
    const d = Math.round((rr - rate(prevFull)) * 10) / 10;
    g('Quality trend', d >= -POLICY.drop ? 'ok' : 'wn', d >= 0 ? `Up ${d} pts vs previous full run` : `Down ${Math.abs(d)} pts vs previous full run`);
  }

  const verdict = gates.some((x) => x.status === 'no') ? 'bad' : gates.some((x) => x.status === 'wn') ? 'warn' : 'good';
  return { gates, verdict, latest, full, prevFull };
}

function briefFor(verdict, gates, latest, full) {
  const sm = smokeOf(latest), smOk = ran(sm) ? sm.failed === 0 : null;
  const sev = full.severity, failedBySev = sev ? SEVS.filter((k) => sev[k].failed).map((k) => `${sev[k].failed} ${k}`) : [];
  const weakF = Object.entries(full.features).map(([k, b]) => [nice(k), rate(b)]).filter(([, p]) => p !== null).sort((a, b) => a[1] - b[1])[0];
  const weakP = Object.entries(full.projects).map(([k, b]) => [niceB(k), rate(b)]).filter(([, p]) => p !== null).sort((a, b) => a[1] - b[1])[0];
  const weak = [weakF, weakP].filter(Boolean).sort((a, b) => a[1] - b[1])[0];
  const bad = gates.filter((g) => g.status === 'no'), warn = gates.filter((g) => g.status === 'wn');
  const quality = pct(rate(full));
  const summary = verdict === 'good' ? `All critical journeys work and ${quality} of checks pass. No known blockers.`
    : verdict === 'warn' ? `Critical journeys ${smOk === false ? 'have issues' : 'work'}; ${quality} of checks pass, but ${full.failed || 'no'} check${full.failed === 1 ? ' is' : 's are'} failing${failedBySev.length ? ` (${failedBySev.join(', ')})` : ''}.`
    : `${bad.length} blocking issue${bad.length > 1 ? 's' : ''}: ${bad.slice(0, 2).map((g) => g.name.toLowerCase()).join(' and ')}. Quality is at ${quality}.`;
  return {
    summary,
    items: [
      { k: 'Core journeys', t: smOk === null ? 'mute' : smOk ? 'good' : 'bad', x: smOk === null ? 'Not run' : smOk ? 'Working' : 'Broken', y: ran(sm) ? `${sm.passed + sm.flaky} of ${ran(sm)} critical checks pass` : 'No smoke checks in run' },
      { k: 'Open issues', t: full.failed ? (sev && (sev.critical.failed) ? 'bad' : 'warn') : 'good', x: full.failed ? `${full.failed} failing` : 'None', y: failedBySev.length ? failedBySev.join(' · ') : full.failed ? 'See "Needs attention"' : 'No failing checks' },
      { k: 'Weakest area', t: weak ? tone(weak[1]) : 'mute', x: weak ? weak[0] : '–', y: weak ? `${weak[1]}% passing` : '' },
    ],
    next: verdict === 'good' ? 'No action needed — proceed with the release.'
      : verdict === 'warn' ? `Release if owners accept the risk: ${warn.slice(0, 3).map((g) => g.name.toLowerCase()).join(', ')}.`
      : `Fix before releasing: ${bad.slice(0, 3).map((g) => g.name.toLowerCase()).join(', ')}.`,
  };
}

/* ---- chart ---- */
function trend(runs) {
  const pts = runs.slice(0, 30).reverse();
  if (pts.length < 2) return '<div class="empty">The trend chart appears after two or more runs.</div>';
  const W = 720, H = 230, L = 36, R = 12, T = 12, B = 28;
  const series = [
    { name: 'Regression', color: 'brand', val: (r) => (isFull(r) ? rate(r) : null) },
    { name: 'Smoke', color: 'good', val: (r) => rate(smokeOf(r)) },
  ];
  const all = series.flatMap((s) => pts.map(s.val)).filter((x) => x !== null);
  const min = Math.floor(Math.min(...all, 90) / 5) * 5, max = 100;
  const X = (i) => L + (i / (pts.length - 1)) * (W - L - R), Y = (v) => T + (1 - (v - min) / (max - min)) * (H - T - B);
  const grid = [];
  for (let v = min; v <= max; v += 5) grid.push(`<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--border)"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v}%</text>`);
  const xl = [0, Math.floor((pts.length - 1) / 2), pts.length - 1].map((i) => `<text x="${X(i)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === pts.length - 1 ? 'end' : 'middle'}">#${esc(pts[i].runNumber)}</text>`).join('');
  const lines = series.map((s) => {
    let d = '', dots = '';
    pts.forEach((r, i) => {
      const v = s.val(r); if (v === null) return;
      d += `${d ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)} `;
      dots += `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="4" fill="var(--${s.color})" stroke="var(--surface)" stroke-width="2" data-tip="${esc(`${s.name} · run #${r.runNumber} · ${v}% · ${when(r.date)}`)}"/>`;
    });
    return `<path d="${d}" fill="none" stroke="var(--${s.color})" stroke-width="2.5" stroke-linejoin="round"/>${dots}`;
  }).join('');
  return `<div class="legend">${series.map((s) => `<span><i style="background:var(--${s.color})"></i>${s.name}</span>`).join('')}</div>
  <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pass rate trend over the last ${pts.length} runs">${grid.join('')}${xl}${lines}</svg>`;
}

/* ---- detail helpers ---- */
function severityHtml(run) {
  if (!run.severity) return '<div class="card" style="margin-bottom:16px"><h2>Severity breakdown</h2><p class="sub">Appears after the next CI run.</p></div>';
  const tot = SEVS.reduce((a, k) => { for (const f of ['total', 'passed', 'failed', 'flaky', 'skipped']) a[f] += run.severity[k][f]; return a; }, { total: 0, passed: 0, failed: 0, flaky: 0, skipped: 0 });
  const row = (label, b, t) => { const p = rate(b); return `<tr><td>${label}</td><td class="num">${b.total}</td><td class="num c-good">${b.passed}</td><td class="num ${b.failed ? 'c-bad' : ''}"><b>${b.failed}</b></td><td class="num ${b.skipped ? 'c-warn' : ''}">${b.skipped}</td><td class="num">${b.flaky}</td>
    <td style="min-width:150px"><div style="display:flex;gap:8px;align-items:center"><div class="bar" style="flex:1"><div class="bg-${tone(p, t)}" style="width:${p ?? 0}%"></div></div><span class="num">${pct(p)}</span></div></td>
    <td><span class="pill ${tone(p, t)}">${TXT[tone(p, t)]}</span></td></tr>`; };
  return `<div class="card" style="margin-bottom:16px"><h2>Severity breakdown</h2><p class="sub">Results by business impact · latest ${isFull(run) ? 'full regression' : 'run'} (#${esc(run.runNumber)}), all browsers. Critical must be 100%.</p>
    <div class="scroll"><table><thead><tr><th>Severity</th><th>Checks</th><th>Passed</th><th>Failed</th><th>Skipped</th><th>Flaky</th><th>Pass rate</th><th>Status</th></tr></thead><tbody>
    ${SEVS.map((k) => row(sevPill(k), run.severity[k], POLICY.severity[k])).join('')}
    <tr style="font-weight:650">${row('<b>Total</b>', tot, { pass: 95, warn: 85 }).slice(4)}
    </tbody></table></div></div>`;
}
const STATUS = { expected: 'Passed', flaky: 'Flaky', unexpected: 'Failed', skipped: 'Skipped' };
const worst = (t) => { const v = Object.values(t.results).map((x) => x[0]); return v.includes('unexpected') ? 'unexpected' : v.includes('flaky') ? 'flaky' : v.every((x) => x === 'skipped') ? 'skipped' : 'expected'; };
const key = (t) => `${t.feature}|${t.title}`;
const defaultPair = (runs) => { const a = runs[0]; return [a, runs.slice(1).find((r) => isFull(r) === isFull(a)) ?? runs[1]]; };
function diffHtml(a, b) {
  if (!b) return '<div class="empty">Comparison appears after the second run.</div>';
  const chip = (k, cur, prev, unit, goodUp, fmtv = (x) => x) => {
    if (cur === null || prev === null) return `<div class="dl"><div class="k">${k}</div><div class="x">${cur === null ? '–' : fmtv(cur)}</div><div class="y c-faint">—</div></div>`;
    const d = Math.round((cur - prev) * 10) / 10, cls = !d ? '' : (d > 0) === goodUp ? 'c-good' : 'c-bad';

  return `<div class="mx" style="grid-template-columns:minmax(0,1.3fr) repeat(${projects.length},minmax(0,1fr))"><span></span>${projects.map((p) => `<span class="mx-h" title="${esc(niceB(p))}">${esc(p)}</span>`).join('')}
    ${feats.map((f, i) => `<span class="mx-r">${esc(nice(f))}</span>${data[i].map((c, j) => c ? `<span class="mx-c t-${tone(c.p, { pass: POLICY.browser.pass, warn: POLICY.browser.warn })}${c.p === min && min < 100 ? ' weak' : ''}" data-tip="${esc(`${nice(f)} on ${niceB(projects[j])}: ${c.n - c.bad}/${c.n} passing`)}">${c.p}%</span>` : '<span class="mx-c t-mute">–</span>').join('')}`).join('')}</div>
    <div class="s" style="color:var(--text-faint);font-size:12px;margin-top:10px">Outlined cell = weakest feature/browser combination.</div>`;
}

const STATUS_FILTER = { failed: 'unexpected', flaky: 'flaky', passed: 'expected', skipped: 'skipped' };
function expRows(full) {
  const q = exp.q.trim().toLowerCase();
  return (full.tests ?? []).map((t) => [t, exp.browser === 'all' ? worst(t) : (t.results[exp.browser]?.[0] ?? 'none')]).filter(([t, st]) =>
    (exp.sev === 'all' || (t.severity ?? 'medium') === exp.sev) && (exp.feat === 'all' || t.feature === exp.feat) &&
    (exp.status === 'all' || st === STATUS_FILTER[exp.status]) && (!q || `${t.title} ${nice(t.feature)}`.toLowerCase().includes(q)));
}
function expBody(full) {
  const all = full.tests ?? [];
  if (!all.length) return '<div class="empty">Check-level detail appears after the next CI run.</div>';
  const rows = expRows(full), projects = exp.browser === 'all' ? Object.keys(full.projects) : [exp.browser];
  const flk = (k) => { let seen = 0, f = 0; for (const r of VIEW_RUNS) { const t = IDX.get(r)?.get(k); if (!t) continue; seen++; if (worst(t) === 'flaky') f++; } return seen ? `${f}/${seen}` : '–'; };
  if (!rows.length) return `<div class="empty">No checks match these filters. <button class="btn" data-act="reset">Clear filters</button></div>`;
  return `<div class="scroll"><table><thead><tr><th>Check</th><th>Severity</th><th>Feature</th>${projects.map((p) => `<th title="${esc(niceB(p))}">${esc(p)}</th>`).join('')}<th>Status</th><th>Flaky runs</th><th>Slowest</th></tr></thead><tbody>
    ${rows.slice(0, exp.limit).map(([t, st]) => `<tr><td><button class="link" data-t="${esc(key(t))}" data-ri="${CUR.fullIdx}">${esc(t.title)}</button></td><td>${sevPill(t.severity ?? 'medium')}</td><td>${esc(nice(t.feature))}</td>
      ${projects.map((p) => { const x = t.results[p]; return `<td><span class="dot ${x ? x[0] : 'none'}" title="${esc(niceB(p))}: ${x ? STATUS[x[0]] : 'not run'}"></span></td>`; }).join('')}
      <td><span class="pill ${ST[st][0]}">${ST[st][1]}</span></td><td class="num">${flk(key(t))}</td><td class="num">${(Math.max(...Object.values(t.results).map((x) => x[1])) / 1000).toFixed(1)}s</td></tr>`).join('')}</tbody></table></div>
    <div class="exp-foot"><span>Showing ${Math.min(exp.limit, rows.length)} of ${rows.length} checks${rows.length !== all.length ? ` (${all.length} total)` : ''}</span>${rows.length > exp.limit ? '<button class="btn" data-act="more">Show more</button>' : ''}</div>`;
}
const refreshExplorer = () => { const el = document.getElementById('exp-body'); if (el) el.innerHTML = expBody(CUR.full); };
const opts = (list, cur) => list.map(([v, l]) => `<option value="${esc(v)}"${cur === v ? ' selected' : ''}>${esc(l)}</option>`).join('');
function explorerCard(full) {
  return `<div class="card" id="explorer" style="margin-bottom:16px"><div class="head"><div><h2>Check explorer</h2><p class="sub">Search and filter every check in run #${esc(full.runNumber)}. Copy the page URL to share this exact view.</p></div><button class="btn" data-act="csv">⬇ Export CSV</button></div>
    <div class="filters"><input id="q" type="search" placeholder="Search checks…  ( / )" value="${esc(exp.q)}" aria-label="Search checks">
      <select data-x="sev" aria-label="Severity">${opts([['all', 'All severities'], ...SEVS.map((k) => [k, k[0].toUpperCase() + k.slice(1)])], exp.sev)}</select>
      <select data-x="feat" aria-label="Feature">${opts([['all', 'All features'], ...Object.keys(full.features).map((k) => [k, nice(k)])], exp.feat)}</select>
      <select data-x="browser" aria-label="Browser">${opts([['all', 'All browsers'], ...Object.keys(full.projects).map((k) => [k, niceB(k)])], exp.browser)}</select>
      <select data-x="status" aria-label="Status">${opts([['all', 'Any status'], ['failed', 'Failed'], ['flaky', 'Flaky'], ['passed', 'Passed'], ['skipped', 'Skipped']], exp.status)}</select></div>
    <div id="exp-body">${expBody(full)}</div></div>`;
}
function downloadCsv() {
  const full = CUR.full; if (!full?.tests) return toast('No check-level data to export yet');
  const projects = Object.keys(full.projects), q = (v) => `"${String(v).replace(/"/g, '""')}"`;
  const lines = [['Feature', 'Check', 'Severity', 'Type', ...projects, 'Slowest (s)'].map(q).join(',')];
  for (const [t] of expRows(full)) lines.push([nice(t.feature), t.title, t.severity ?? 'medium', t.smoke ? 'Smoke' : 'Regression', ...projects.map((p) => (t.results[p] ? STATUS[t.results[p][0]] : 'Not run')), (Math.max(...Object.values(t.results).map((x) => x[1])) / 1000).toFixed(1)].map(q).join(','));
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' })), download: `qa-checks-run-${full.runNumber}.csv` });
  a.click(); URL.revokeObjectURL(a.href); toast(`Exported ${lines.length - 1} checks`);
}
function printBrief() { // light theme + only the data-print sections, via the print stylesheet
  const root = document.documentElement, prev = root.dataset.theme;
  root.dataset.theme = 'light'; document.body.classList.add('print-brief');
  const done = () => { document.body.classList.remove('print-brief'); root.dataset.theme = prev; removeEventListener('afterprint', done); };
  addEventListener('afterprint', done); print();
}
function toggleTheme() {
  const dark = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('qa-theme', dark ? 'light' : 'dark'); } catch {}
}

/* ---- failure / check detail panel ---- */
function openTest(k, run) {
  if (!run) return;
  const fails0 = (run.failedTests ?? []);
  const sep = k.indexOf('|'), feature = k.slice(0, sep), title = k.slice(sep + 1);
  const fails = fails0.filter((f) => f.feature === feature && f.title === title);
  const t = IDX.get(run)?.get(k) ?? { feature, title, severity: fails[0]?.severity ?? 'medium', smoke: false, results: {} };
  const projects = Object.keys(t.results).length ? Object.keys(t.results) : fails.map((f) => f.project);
  const cause = fails[0] ? causeOf(fails[0]) : null;
  const trace = fails.find((f) => f.traceUrl);
  const h = histOf(VIEW_RUNS, k);
  document.getElementById('dlg-t').textContent = title;
  document.getElementById('dlg-b').innerHTML = `
    <div class="chips" style="margin-bottom:6px">${sevPill(t.severity ?? 'medium')}<span class="chip">${esc(nice(feature))}</span><span class="pill ${t.smoke ? 'brand' : 'mute'}">${t.smoke ? 'Smoke' : 'Regression'}</span>${cause ? `<span class="cause" style="--c:${CAUSE[cause][1]}">${CAUSE[cause][0]} (estimated)</span>` : ''}<span class="chip">Run #${esc(run.runNumber)} · ${esc(when(run.date))}</span></div>
    <div class="dlg-sec">Result by browser</div>
    <div class="scroll"><table><thead><tr><th>Browser</th><th>Status</th><th>Time</th></tr></thead><tbody>
      ${projects.map((p) => { const x = t.results[p], f = fails.find((y) => y.project === p), st = x ? x[0] : f ? 'unexpected' : 'none'; return `<tr><td>${esc(niceB(p))}</td><td><span class="pill ${ST[st][0]}">${ST[st][1]}</span></td><td class="num">${x ? (x[1] / 1000).toFixed(1) + 's' : '–'}</td></tr>`; }).join('') || '<tr><td colspan="3" class="c-faint">No per-browser detail in this run.</td></tr>'}
    </tbody></table></div>
    ${fails.length ? `<div class="dlg-sec">Error</div>${fails.map((f) => `<div class="errbox" style="margin-bottom:8px"><b>${esc(niceB(f.project))}</b>\n${esc(f.error ?? 'No error message recorded.')}${f.file ? `\n\n${esc(f.file)}` : ''}</div>`).join('')}` : ''}
    ${h.some(Boolean) ? `<div class="dlg-sec">History · oldest → newest (${h.length} runs)</div>${strip(h)}` : ''}
    <div class="dlg-sec">Investigate</div>
    <ul class="short">
      ${trace ? `<li><a class="btn" href="${esc(trace.traceUrl)}" target="_blank" rel="noopener">Open trace ↗</a></li>` : fails.length ? `<li class="muted-sm">Traces are saved on retried failures as the <b>traces-${esc(fails[0].project)}</b> artifact of the CI run. Unzip it and run <span class="mono">npx playwright show-trace trace.zip</span>.</li>` : ''}
      ${run.runUrl ? `<li><a href="${esc(run.runUrl)}" target="_blank" rel="noopener">Open CI run ↗</a> · <a href="${ALLURE_URL}" target="_blank" rel="noopener">Allure report ↗</a></li>` : ''}
    </ul>`;
  document.getElementById('dlg').showModal();
}
function openHelp() {
  document.getElementById('dlg-t').textContent = 'Keyboard shortcuts';
  document.getElementById('dlg-b').innerHTML = `<table><tbody>${[['/', 'Search checks'], ['t', 'Toggle light / dark theme'], ['r', 'Refresh results now'], ['e', 'Export checks as CSV'], ['?', 'Show this help'], ['Esc', 'Close a panel']].map(([a, b]) => `<tr><td><kbd>${a}</kbd></td><td>${b}</td></tr>`).join('')}</tbody></table>`;

/* ---- sections ---- */
let featView = 'all';
function featuresHtml(full) {
  const entries = Object.entries(full.features).map(([k, b]) => {
    const bucket = featView === 'smoke' ? (b.smoke ?? blank) : featView === 'regression' ? { total: b.total - (b.smoke?.total ?? 0), passed: b.passed - (b.smoke?.passed ?? 0), failed: b.failed - (b.smoke?.failed ?? 0), flaky: b.flaky - (b.smoke?.flaky ?? 0), skipped: b.skipped - (b.smoke?.skipped ?? 0) } : b;
    return [k, bucket, rate(bucket), rate(b.smoke ?? blank), rate(b)];
  }).sort((a, b) => (a[2] ?? 101) - (b[2] ?? 101));
  return `<div class="feats">${entries.map(([k, b, p, sp, ap]) => {
    const t = tone(p);
    return `<button class="feat" data-f="${esc(k)}"><div class="row"><b>${esc(nice(k))}</b><span class="pill ${t}">${TXT[t]}</span></div>
      <div class="big c-${t}">${pct(p)}</div><div class="bar"><div class="bg-${t}" style="width:${p ?? 0}%"></div></div>
      <div class="meta"><span>${b.passed + b.flaky}/${ran(b)} passing</span><span>${b.failed ? `<b class="c-bad">${b.failed} failing</b>` : 'No failures'}</span></div>
      <div class="meta"><span>Smoke ${pct(sp)}</span><span>Overall ${pct(ap)}</span></div><div class="more">View checks →</div></button>`;
  }).join('') || '<div class="empty">No feature data yet.</div>'}</div>`;
}

function render(runs) {
  const app = document.getElementById('app');
  if (!runs.length) {
    app.innerHTML = ALL.length
      ? `${topHtml(ALL[0])}${toolbarHtml(runs)}<div class="empty">No runs match <b>${esc(filterLabel())}</b>.${(() => {
          const near = PRESETS.filter(([v]) => v !== 'all' && v !== 'custom').find(([v]) => ALL.some((r) => envMatch(r) && Date.now() - new Date(r.date) <= Number(v) * 864e5));
          return near ? ` <button class="btn" data-k="range" data-v="${near[0]}">Show last ${near[1]}</button>` : '';
        })()} <button class="btn" data-act="showall">Show all runs</button></div>`
      : '<div class="empty">No runs recorded yet. Results appear here after the next CI run on main.</div>';
    return;
  }
  VIEW_RUNS = runs; buildIdx(runs);
  const { gates, verdict, latest, full, prevFull } = readiness(runs);
  const score = healthScore(latest, full), prevScore = prevFull ? healthScore(prevFull, prevFull) : null;
  const vt = { good: ['✓', 'GO', 'Ready to release', 'All quality gates are green. Critical journeys work and the regression suite is within target.'],
    warn: ['!', 'CONDITIONAL', 'Release with caution', ''],
    bad: ['✕', 'NO-GO', 'Not ready to release', ''] }[verdict];
  const brief = briefFor(verdict, gates, latest, full);
  const sc = score >= 95 ? 'good' : score >= 85 ? 'warn' : 'bad';
  const R = 74, C = 2 * Math.PI * R;
  const hist = [...runs].reverse();

  const reg = rate(full), sm = rate(smokeOf(latest)), fl = flakeRate(full);

  CUR = { full, fullIdx: runs.indexOf(full) };

  app.innerHTML = `
  <div class="print-only" data-print><h1>Release brief · ${esc(vt[1])}</h1><p>${esc(brief.summary)}</p><p class="muted-sm">${esc(filterLabel())} · Run #${esc(latest.runNumber)} · ${esc(when(latest.date))} · ${esc(latest.branch)}${latest.sha ? ' @ ' + esc(latest.sha) : ''} · generated ${esc(new Date().toLocaleString())}</p></div>
  ${topHtml(latest)}
  ${toolbarHtml(runs)}

  <div class="grid g-hero" data-print>
    <div class="card verdict ${verdict}">
      <div class="v-badge v-${verdict}"><div class="v-ic">${vt[0]}</div><div class="v-t">${vt[1]}</div></div>
      <div class="v-body"><h2>${vt[2]}</h2><p>${esc(brief.summary)}</p>
        <div class="brief">${brief.items.map((x) => `<div class="bf"><div class="k">${esc(x.k)}</div><div class="x c-${x.t}">${esc(x.x)}</div><div class="y">${esc(x.y)}</div></div>`).join('')}</div>
        <div class="next ${verdict}">Next step: ${esc(brief.next)}</div>
        <details class="gdet"><summary>View all ${gates.length} quality gates ▾</summary><div class="gates">${gates.map((x) => `<div class="gate"><i class="${x.status}">${{ ok: '✓', wn: '!', no: '✕' }[x.status]}</i><div>${esc(x.name)}<span>${esc(x.detail)}</span></div></div>`).join('')}</div></details>
      </div>
    </div>
    <div class="card score">
      <div class="ring"><svg width="170" height="170" viewBox="0 0 170 170"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--brand)"/><stop offset="1" stop-color="var(--${sc})"/></linearGradient></defs><circle cx="85" cy="85" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="12"/>
        <circle cx="85" cy="85" r="${R}" fill="none" stroke="url(#rg)" stroke-width="12" stroke-linecap="round" class="arc" stroke-dasharray="0 ${C}" data-to="${(C * score) / 100} ${C}"/></svg>
        <div class="n"><b class="c-${sc}">${score}</b><small>Site health score</small></div></div>
      <div class="cap">${prevScore === null ? 'First scored run.' : score === prevScore ? 'Unchanged since the previous full run.' : `${score > prevScore ? 'Up' : 'Down'} ${Math.abs(score - prevScore)} points since the previous full run.`}

    </div>
  </div>

  <div class="grid g-kpi" data-print>
    <div class="card kpi"><div class="l">Regression pass rate</div><div class="v c-${tone(reg, { pass: POLICY.regression.pass, warn: POLICY.regression.warn })}">${pct(reg)}</div>${dlt(reg, prevFull ? rate(prevFull) : null, ' pts')}${spark(fullHist.map(rate), 'brand')}</div>
    <div class="card kpi"><div class="l">Smoke pass rate</div><div class="v c-${tone(sm, { pass: 100, warn: 90 })}">${pct(sm)}</div>${dlt(sm, prevSm, ' pts')}${spark(hist.map((r) => rate(smokeOf(r))), 'good')}</div>
    <div class="card kpi"><div class="l">Checks executed</div><div class="v">${ran(full)}</div><div class="d">${Object.keys(full.features).length} features × ${Object.keys(full.projects).length} platforms</div>${spark(fullHist.map(ran), 'brand')}</div>
    <div class="card kpi"><div class="l">Failing checks</div><div class="v ${full.failed ? 'c-bad' : 'c-good'}">${full.failed}</div>${dlt(full.failed, prevFull?.failed, '', false)}${spark(fullHist.map((r) => r.failed), 'bad')}</div>
    <div class="card kpi"><div class="l">Flaky rate</div><div class="v c-${fl <= POLICY.flake.pass ? 'good' : fl <= POLICY.flake.warn ? 'warn' : 'bad'}">${fl}%</div>${dlt(fl, prevFull ? flakeRate(prevFull) : null, ' pts', false)}${spark(fullHist.map(flakeRate), 'warn')}</div>
    <div class="card kpi"><div class="l">Suite runtime</div><div class="v">${dur(full.durationMs)}</div>${dlt(Math.round(full.durationMs / 1000), prevFull && Math.round(prevFull.durationMs / 1000), 's', false)}${spark(fullHist.map((r) => r.durationMs), 'brand')}</div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="head"><div><h2>Feature health</h2><p class="sub">How each product area is performing in the latest ${isFull(full) ? 'full regression' : 'run'} (#${esc(full.runNumber)})</p></div>

    <div id="feats">${featuresHtml(full)}</div>
  </div>

  <div data-print>${severityHtml(full)}</div>

  <div class="grid g-2">
    <div class="card"><h2>Quality trend</h2><p class="sub">Pass rate across the last ${Math.min(30, runs.length)} runs</p>${trend(runs)}</div>
    <div class="card"><h2>Smoke vs regression</h2><p class="sub">Critical journeys versus the full suite</p>
      ${[['Smoke · critical journeys', smokeOf(latest)], ['Regression · full suite', full]].map(([n, b]) => { const p = rate(b), t = tone(p, n.startsWith('Smoke') ? { pass: 100, warn: 90 } : { pass: POLICY.regression.pass, warn: POLICY.regression.warn }); return `
      <div style="margin-bottom:18px"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><b>${n}</b><span class="pill ${t}">${pct(p)}</span></div>
      <div class="bar"><div class="bg-${t}" style="width:${p ?? 0}%"></div></div>
      <div style="display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--text-dim);flex-wrap:wrap"><span>${b.passed} passed</span><span class="${b.failed ? 'c-bad' : ''}">${b.failed} failed</span><span>${b.flaky} flaky</span><span>${b.skipped} skipped</span></div></div>`; }).join('')}
      <div style="color:var(--text-faint);font-size:12px">Smoke runs on every pull request; the full regression runs on merge to main and nightly.</div>
    </div>
  </div>

  <div class="grid g-eq">
    <div class="card"><h2>What is behind the failures</h2><p class="sub">Failed checks by estimated cause, per week</p>${causesHtml(runs)}</div>
    <div class="card"><h2>Feature × browser matrix</h2><p class="sub">Where exactly things break · latest ${isFull(full) ? 'full regression' : 'run'} (#${esc(full.runNumber)})</p>${matrixHtml(full)}</div>
  </div>

  <div class="card" data-print style="margin-bottom:16px"><h2>Platform coverage</h2><p class="sub">Browsers and devices in the latest full run</p>
    <div class="scroll"><table><thead><tr><th>Platform</th><th>Checks</th><th>Passing</th><th>Failing</th><th>Flaky</th><th style="min-width:140px">Pass rate</th><th>Status</th></tr></thead><tbody>
    ${Object.entries(full.projects).map(([k, b]) => { const p = rate(b), t = tone(p, { pass: POLICY.browser.pass, warn: POLICY.browser.warn }); return `<tr><td><b>${esc(niceB(k))}</b></td><td class="num">${ran(b)}</td><td class="num">${b.passed + b.flaky}</td><td class="num ${b.failed ? 'c-bad' : ''}">${b.failed}</td><td class="num">${b.flaky}</td>
      <td><div style="display:flex;gap:8px;align-items:center"><div class="bar" style="flex:1"><div class="bg-${t}" style="width:${p ?? 0}%"></div></div><span class="num">${pct(p)}</span></div></td><td><span class="pill ${t}">${TXT[t]}</span></td></tr>`; }).join('')}
    </tbody></table></div></div>

  <div class="grid g-eq" data-print>
    <div class="card"><h2>Needs attention</h2><p class="sub">Checks failing after retries in the latest full run</p>
      ${failList.length ? failList.slice(0, 8).map((f) => `<div class="item clickable" role="button" tabindex="0" data-t="${esc(f.feature + '|' + f.title)}" data-ri="${CUR.fullIdx}"><div><div class="t">${f.severity ? sevPill(f.severity) + ' ' : ''}${esc(nice(f.feature))} — ${esc(f.title)}</div><div class="s">${esc(niceB(f.project))}${f.error ? ' · ' + esc(f.error) : ''}</div></div><span class="pill bad">Failing</span></div>`).join('') + (failList.length > 8 ? `<div class="s" style="padding-top:10px;color:var(--text-faint)">+${failList.length - 8} more in the Allure report</div>` : '') : '<div class="empty">Nothing failing. 🎉</div>'}
    </div>
    <div class="card"><h2>Flaky leaderboard</h2><p class="sub">Checks that pass only after a retry · last ${runs.length} run${runs.length > 1 ? 's' : ''}. Click one for its history.</p>
      ${flakyBoard(runs)}
    </div>
  </div>

  <div class="card" style="margin-bottom:16px"><h2>Check history heatmap</h2><p class="sub">Every check across the last ${Math.min(20, runs.filter((r) => r.tests).length)} runs · click a cell to investigate · problem checks first</p>${heatHtml(runs)}</div>

  <div class="grid g-eq">
    <div class="card"><h2>Compare runs</h2><p class="sub">Pick any two runs to see regressions, fixes, flaky and slower checks</p>
      ${(() => { const [da, db] = defaultPair(runs); const o = (sel) => runs.slice(0, 30).map((r, i) => `<option value="${i}"${r === sel ? ' selected' : ''}>#${esc(r.runNumber)} · ${esc(when(r.date))} · ${isFull(r) ? 'Full' : 'Smoke'} · ${pct(rate(r))}</option>`).join('');
        return `<div class="filters"><select data-cmp="a" aria-label="Newer run">${o(da)}</select><span class="c-faint" style="align-self:center">vs</span><select data-cmp="b" aria-label="Older run">${o(db)}</select></div><div id="cmp">${diffHtml(da, db)}</div>`; })()}</div>
    <div class="card"><h2>Slowest checks</h2><p class="sub">Longest time per check, across browsers — candidates to speed up</p>${slowHtml(full, runs)}</div>
  </div>

  ${explorerCard(full)}

  <div class="card"><h2>Recent runs</h2><p class="sub">Last 5 automated runs · click a run for the breakdown</p>
    <div class="runrow" style="font-size:12px;color:var(--text-faint);padding-top:0"><span>Run</span><span>Date</span><span>Trigger</span><span>Scope</span><span>Checks</span><span>Failed</span><span>Pass rate</span></div>
    ${runs.slice(0, 5).map((r) => runHtml(r)).join('')}
  </div>
  <footer>Generated from Playwright results by GitHub Actions · ${runs.length} run${runs.length > 1 ? 's' : ''} of history · gate thresholds are defined in <span class="mono">dashboard/index.html</span></footer>`;

  document.getElementById('seg').onclick = (e) => {
    const b = e.target.closest('button'); if (!b) return;
    featView = b.dataset.v;
    document.querySelectorAll('#seg button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    document.getElementById('feats').innerHTML = featuresHtml(full);
    wireFeats();
  };
  const wireFeats = () => document.querySelectorAll('.feat').forEach((el) => { el.onclick = () => openFeature(full, el.dataset.f); });
  wireFeats();
  requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll('.arc').forEach((a) => a.setAttribute('stroke-dasharray', a.dataset.to))));
  const tip = document.getElementById('tip');
  document.querySelectorAll('[data-tip]').forEach((el) => {
    el.addEventListener('mousemove', (e) => { tip.textContent = el.dataset.tip; tip.style.opacity = 1; tip.style.left = `${e.clientX + 12}px`; tip.style.top = `${e.clientY + 12}px`; });
    el.addEventListener('mouseleave', () => { tip.style.opacity = 0; });
  });
}

let savedTheme = null;
try { savedTheme = localStorage.getItem('qa-theme'); } catch {}
document.documentElement.dataset.theme = savedTheme || 'dark'; // dark by default

const draw = () => { const y = scrollY; render(inView()); scrollTo(0, y); };
function showError() {
  document.getElementById('app').innerHTML = '<div class="empty">Could not load the test results. <button class="btn" data-act="reload">Try again</button></div>';
}
async function load(mode) {
  try {
    const r = await fetch('data/runs.json', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    const changed = !ALL.length || data.length !== ALL.length || data[0]?.id !== ALL[0]?.id || data[0]?.date !== ALL[0]?.date;
    ALL = data;
    if (!envExplicit && view.env === 'all') view.env = defaultEnv();
    if (changed) draw();
    if (mode === 'manual') toast(changed ? 'Updated with the latest results' : 'Already up to date');
  } catch { if (!ALL.length) showError(); else if (mode === 'manual') toast('Could not refresh right now'); }
}

const app = document.getElementById('app');
app.addEventListener('click', (e) => {
  const kv = e.target.closest('[data-k]');
  if (kv) {
    const { k, v } = kv.dataset;
    if (k === 'env') envExplicit = true;
    if (k === 'env' && v !== 'all') { // multi-select: toggle this environment in the set
      const all = envList(), cur = new Set(envSel() ?? []);
      cur.has(v) ? cur.delete(v) : cur.add(v);
      view.env = !cur.size || cur.size === all.length ? 'all' : [...cur].sort().join(',');
    } else if (k === 'range' && v === 'custom') {
      view.range = 'custom'; view.to ||= iso(Date.now()); view.from ||= iso(Date.now() - 30 * 864e5);
    } else view[k] = v;
    syncUrl(); draw(); return;
  }
  const act = e.target.closest('[data-act]');
  if (act) {
    ({ theme: toggleTheme, csv: downloadCsv, brief: printBrief, reload: () => load('manual'),
      more: () => { exp.limit += 40; refreshExplorer(); },
      resetview: () => { Object.assign(view, { range: 'all', env: defaultEnv(), from: '', to: '' }); syncUrl(); draw(); },
      showall: () => { Object.assign(view, { range: 'all', env: 'all', from: '', to: '' }); envExplicit = true; syncUrl(); draw(); },
      reset: () => { Object.assign(exp, { q: '', sev: 'all', feat: 'all', browser: 'all', status: 'all', limit: 40 }); syncUrl(); draw(); } })[act.dataset.act]?.();
    return;
  }
  const tt = e.target.closest('[data-t]');
  if (tt) openTest(tt.dataset.t, VIEW_RUNS[Number(tt.dataset.ri) || 0]);
});
app.addEventListener('keydown', (e) => { // role="button" rows: Enter / Space open the detail panel
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('[role="button"][data-t]')) { e.preventDefault(); e.target.click(); }
});
app.addEventListener('input', (e) => { if (e.target.id === 'q') { exp.q = e.target.value; exp.limit = 40; syncUrl(); refreshExplorer(); } });
app.addEventListener('change', (e) => {
  if (e.target.dataset?.d) {
    view[e.target.dataset.d] = e.target.value;
    if (view.from && view.to && view.from > view.to) [view.from, view.to] = [view.to, view.from];
    syncUrl(); draw(); return;
  }
  const x = e.target.dataset?.x;
  if (x) { exp[x] = e.target.value; exp.limit = 40; syncUrl(); refreshExplorer(); return; }
  if (e.target.dataset?.cmp) {
    const [a, b] = ['a', 'b'].map((k) => VIEW_RUNS[Number(app.querySelector(`[data-cmp="${k}"]`).value)]);
    document.getElementById('cmp').innerHTML = diffHtml(a, b);
  }
});
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.matches?.('input,select,textarea')) return;
  const act = { '/': () => { const q = document.getElementById('q'); if (q) { q.scrollIntoView({ block: 'center' }); q.focus(); } }, t: toggleTheme, r: () => load('manual'), e: downloadCsv, '?': openHelp }[e.key];
  if (act) { e.preventDefault(); act(); }
});
document.getElementById('dlg-x').onclick = () => document.getElementById('dlg').close();
document.getElementById('dlg').addEventListener('click', (ev) => { if (ev.target.id === 'dlg') ev.target.close(); });

load();
setInterval(() => { if (!document.hidden && !document.getElementById('dlg').open) load(); }, 300000); // auto-refresh every 5 min
setInterval(() => { const el = document.getElementById('fresh'); if (el && ALL[0]) { el.textContent = `Last run ${ago(ALL[0].date)}`; el.className = `fresh fresh-${freshTone(ALL[0].date)}`; } }, 60000);
</script>
</body>
</html>
