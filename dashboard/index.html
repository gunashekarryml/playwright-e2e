<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QA Health Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#10161b;--surface:#161f26;--surface-2:#1c2731;--border:#283440;
  --text:#eaf1f6;--text-dim:#9fb0bd;--text-faint:#6c7e8c;
  --accent:#d9a441;--accent-soft:#3a3122;
  --good:#4cb47c;--good-soft:#163024;--warn:#e0a732;--warn-soft:#332a14;--bad:#e05d4f;--bad-soft:#331b17;
  --mono:'IBM Plex Mono',ui-monospace,monospace;--body:'IBM Plex Sans',system-ui,sans-serif;--display:'Sora',system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root{
  --bg:#f4f1ea;--surface:#fff;--surface-2:#f0ece3;--border:#ddd6c7;
  --text:#1a2229;--text-dim:#4d5b66;--text-faint:#76838d;
  --accent:#a8741a;--accent-soft:#f6ead2;
  --good:#1f7a4a;--good-soft:#dff1e7;--warn:#9a6a00;--warn-soft:#faefcf;--bad:#b73a2d;--bad-soft:#f8dfdb;color-scheme:light;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px var(--body);padding:28px 16px 60px;min-height:100vh}
.wrap{max-width:1280px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.eyebrow{font:11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
h1{font:700 clamp(22px,3vw,30px) var(--display);margin:0}
.sub{color:var(--text-dim);font-size:13.5px;margin-top:6px}
.meta{display:flex;gap:18px;flex-wrap:wrap;font:12px var(--mono);color:var(--text-dim)}
.meta b{color:var(--text)}
.meta a{color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--good)}
.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.kpi,.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px}
.kpi{padding:16px 18px}
.kpi .label{font-size:11.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.kpi .val{font:700 28px var(--display);font-variant-numeric:tabular-nums}
.delta{font:12px var(--mono);margin-top:4px;color:var(--text-faint)}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
.panel{padding:18px 20px;margin-bottom:16px;overflow-x:auto}
.grid2 .panel{margin-bottom:0}
.panel h2{font:600 15px var(--display);margin:0 0 4px}
.panel-sub{color:var(--text-faint);font-size:12px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint);padding:0 10px 10px 0;border-bottom:1px solid var(--border)}
td{padding:10px 10px 10px 0;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.feat-name{font-weight:600;text-transform:capitalize}
.bar-track{background:var(--surface-2);border-radius:5px;height:8px;width:120px;overflow:hidden}
.bar-fill{height:100%;border-radius:5px}
.pill{font:600 11px var(--mono);padding:3px 8px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.rel-list{display:flex;flex-direction:column;gap:10px}
.rel{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);color:inherit;text-decoration:none}
.rel.current{border-color:var(--accent);background:var(--accent-soft)}
.rel-ver{font:600 13px var(--mono)}.rel-date{font-size:10.5px;color:var(--text-faint)}
.rel-score{font:700 18px var(--display)}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 0 10px;margin-bottom:10px;border-bottom:1px dashed var(--border);font-size:12.5px}
.item:last-child{border:none;margin:0;padding:0}
.item-name{font-weight:500}.item-sub{color:var(--text-faint);font:10.5px var(--mono);word-break:break-word}
.empty{color:var(--text-faint);font-size:13px}
svg.trend{width:100%;height:90px;display:block}
footer{margin-top:28px;color:var(--text-faint);font:11px var(--mono);text-align:center}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="empty">Loading…</p></div>
<script>
const $ = (s) => document.createElement(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tone = (p) => (p >= 95 ? 'good' : p >= 85 ? 'warn' : 'bad');
const label = { good: 'Healthy', warn: 'Watch', bad: 'At Risk' };
const rate = (b) => { const e = b.total - b.skipped; return e ? Math.round(((b.passed + b.flaky) / e) * 1000) / 10 : 0; };
const dur = (ms) => { const s = Math.round(ms / 1000); return s >= 60 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${s}s`; };
const fmt = (d) => new Date(d).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
const delta = (cur, prev, unit, goodUp = true) => {
  if (prev === undefined) return '<div class="delta">first recorded run</div>';
  const d = Math.round((cur - prev) * 10) / 10;
  if (d === 0) return '<div class="delta">no change vs previous run</div>';
  const good = (d > 0) === goodUp;
  return `<div class="delta ${good ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'} ${Math.abs(d)}${unit} vs previous run</div>`;
};

function trendSvg(runs) {
  const pts = runs.slice(0, 30).reverse();
  if (pts.length < 2) return '<p class="empty">Trend appears after two or more runs.</p>';
  const w = 600, h = 90, min = Math.min(...pts.map((r) => r.passRate), 90) - 2;
  const xy = pts.map((r, i) => [(i / (pts.length - 1)) * w, h - 8 - ((r.passRate - min) / (100 - min)) * (h - 16)]);
  const line = xy.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  return `<svg class="trend" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Pass rate trend over last ${pts.length} runs">
    <path d="${line} L${w},${h} L0,${h} Z" fill="var(--good)" opacity=".12"/>
    <path d="${line}" fill="none" stroke="var(--good)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

function render(runs) {
  const app = document.getElementById('app');
  if (!runs.length) { app.innerHTML = '<p class="empty">No runs recorded yet. Results appear here after the next CI run.</p>'; return; }
  const [cur, prev] = runs;
  const t = tone(cur.passRate);
  const feats = Object.entries(cur.features).sort((a, b) => rate(a[1]) - rate(b[1]));
  const flakyCount = {};
  runs.slice(0, 5).forEach((r) => r.flakyTests.forEach((f) => { const k = `${f.feature}›${f.title}`; (flakyCount[k] ??= { ...f, n: 0 }).n++; }));
  const flaky = Object.values(flakyCount).sort((a, b) => b.n - a.n).slice(0, 8);
  const window = Math.min(5, runs.length);

  app.innerHTML = `
  <header>
    <div>
      <p class="eyebrow">QA Engineering · Automated Regression</p>
      <h1>QA Health Dashboard</h1>
      <p class="sub">Playwright suite results, pushed automatically after every CI run</p>
    </div>
    <div class="meta">
      <span><span class="dot ${cur.failed ? 'bad' : cur.flaky ? 'warn' : ''}"></span><b>Run #${esc(cur.runNumber)}</b> ${cur.failed ? 'failing' : 'passing'}</span>
      <span>Updated <b>${esc(fmt(cur.date))}</b></span>
      <span>Branch <b>${esc(cur.branch)}</b>${cur.sha ? ' @ ' + esc(cur.sha) : ''}</span>
      <span><a href="../">Allure report ↗</a></span>
    </div>
  </header>

  <div class="kpi-row">
    <div class="kpi"><div class="label">Overall Pass Rate</div><div class="val">${cur.passRate}%</div>${delta(cur.passRate, prev?.passRate, 'pts')}</div>
    <div class="kpi"><div class="label">Tests Executed</div><div class="val">${cur.total - cur.skipped}</div><div class="delta">${Object.keys(cur.features).length} feature suites · ${Object.keys(cur.projects).length} browsers</div></div>
    <div class="kpi"><div class="label">Failed</div><div class="val" style="color:${cur.failed ? 'var(--bad)' : 'inherit'}">${cur.failed}</div>${delta(cur.failed, prev?.failed, '', false)}</div>
    <div class="kpi"><div class="label">Flaky Tests</div><div class="val">${cur.flaky}</div>${delta(cur.flaky, prev?.flaky, '', false)}</div>
    <div class="kpi"><div class="label">Suite Runtime</div><div class="val">${dur(cur.durationMs)}</div>${delta(Math.round(cur.durationMs / 1000), prev && Math.round(prev.durationMs / 1000), 's', false)}</div>
  </div>

  <div class="grid2">
    <div class="panel">
      <h2>Feature Health</h2>
      <p class="panel-sub">Pass rate by spec file · latest run, all browsers</p>
      <table><thead><tr><th>Feature</th><th>Tests</th><th></th><th>Pass rate</th><th>Status</th></tr></thead><tbody>
      ${feats.map(([n, b]) => { const p = rate(b), k = tone(p); return `<tr>
        <td class="feat-name">${esc(n)}</td><td class="num">${b.total}</td>
        <td><div class="bar-track"><div class="bar-fill" style="width:${p}%;background:var(--${k})"></div></div></td>
        <td class="num" style="color:var(--${k})">${p}%</td><td><span class="pill ${k}">${label[k]}</span></td></tr>`; }).join('')}
      </tbody></table>
    </div>
    <div class="panel">
      <h2>Run History</h2>
      <p class="panel-sub">Pass rate per CI run · newest first</p>
      ${trendSvg(runs)}
      <div class="rel-list" style="margin-top:14px">
      ${runs.slice(0, 6).map((r, i) => `<a class="rel ${i ? '' : 'current'}" ${r.runUrl ? `href="${esc(r.runUrl)}" target="_blank" rel="noopener"` : ''}>
        <div><div class="rel-ver">#${esc(r.runNumber)}</div><div class="rel-date">${esc(fmt(r.date))}</div></div>
        <div style="color:var(--text-dim);font-size:12px">${esc(r.event)} · ${r.failed} failed · ${r.flaky} flaky</div>
        <div class="rel-score" style="color:var(--${tone(r.passRate)})">${r.passRate}</div></a>`).join('')}
      </div>
    </div>
  </div>

  <div class="panel" style="margin-top:16px">
    <h2>Browser Breakdown</h2>
    <p class="panel-sub">Latest run per Playwright project</p>
    <table><thead><tr><th>Project</th><th>Tests</th><th>Passed</th><th>Failed</th><th>Flaky</th><th>Skipped</th><th>Pass rate</th></tr></thead><tbody>
    ${Object.entries(cur.projects).map(([n, b]) => `<tr><td class="feat-name">${esc(n)}</td><td class="num">${b.total}</td><td class="num">${b.passed}</td><td class="num">${b.failed}</td><td class="num">${b.flaky}</td><td class="num">${b.skipped}</td><td class="num" style="color:var(--${tone(rate(b))})">${rate(b)}%</td></tr>`).join('')}
    </tbody></table>
  </div>

  <div class="grid2">
    <div class="panel">
      <h2>Failures in Latest Run</h2>
      <p class="panel-sub">Tests that failed after all retries</p>
      ${cur.failedTests.length ? cur.failedTests.map((f) => `<div class="item"><div><div class="item-name">${esc(f.feature)} › ${esc(f.title)}</div><div class="item-sub">${esc(f.project)} · ${esc(f.error)}</div></div><span class="pill bad">Failed</span></div>`).join('') : '<p class="empty">No failures. 🎉</p>'}
    </div>
    <div class="panel">
      <h2>Flaky Tests</h2>
      <p class="panel-sub">Passed only after a retry · last ${window} run${window > 1 ? 's' : ''}</p>
      ${flaky.length ? flaky.map((f) => `<div class="item"><div><div class="item-name">${esc(f.feature)} › ${esc(f.title)}</div><div class="item-sub">${esc(f.file)} · flaked in ${f.n}/${window} runs</div></div><span class="pill ${f.n >= 3 ? 'bad' : 'warn'}">${f.n >= 3 ? 'High' : 'Medium'}</span></div>`).join('') : '<p class="empty">No flaky tests detected.</p>'}
    </div>
  </div>
  <footer>Source: Playwright JSON reporter · published by GitHub Actions · ${runs.length} run${runs.length > 1 ? 's' : ''} of history</footer>`;
}

fetch('data/runs.json', { cache: 'no-store' })
  .then((r) => (r.ok ? r.json() : []))
  .catch(() => [])
  .then(render);
</script>
</body>
</html>
