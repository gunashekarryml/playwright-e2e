<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QA Release Dashboard · Bento layout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#eef3fb;--surface:#fff;--surface-solid:#fff;--surface-2:#f1f5fc;--border:#d9e3f3;
  --text:#0a1a3a;--text-dim:#44567a;--text-faint:#7184a6;
  --brand:#1d4ed8;--brand-2:#0ea5e9;--brand-soft:#e3ecff;
  --good:#12805c;--good-soft:#dcf5ea;--warn:#a15c07;--warn-soft:#fdf0d5;--bad:#c42b3a;--bad-soft:#fde3e5;
  --shadow:0 1px 2px rgba(10,26,58,.06),0 10px 28px rgba(29,78,216,.07);
  --sans:'Inter',system-ui,-apple-system,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#050c1d;--surface:#0c1830;--surface-solid:#0c1830;--surface-2:#112245;--border:#1c3157;
  --text:#e8f0ff;--text-dim:#a3b6d9;--text-faint:#6f87b3;
  --brand:#5aa0ff;--brand-2:#22d3ee;--brand-soft:#12284f;
  --good:#3ecf9a;--good-soft:#11322a;--warn:#f2b94b;--warn-soft:#38300f;--bad:#ff7380;--bad-soft:#3a1a22;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#050c1d;--surface:#0c1830;--surface-solid:#0c1830;--surface-2:#112245;--border:#1c3157;
  --text:#e8f0ff;--text-dim:#a3b6d9;--text-faint:#6f87b3;
  --brand:#5aa0ff;--brand-2:#22d3ee;--brand-soft:#12284f;
  --good:#3ecf9a;--good-soft:#11322a;--warn:#f2b94b;--warn-soft:#38300f;--bad:#ff7380;--bad-soft:#3a1a22;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 72px}
a{color:var(--brand);text-decoration:none}a:hover{text-decoration:underline}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;color:#fff;font-weight:800;box-shadow:0 6px 16px rgba(29,78,216,.4)}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand small{display:block;color:var(--text-faint);font-size:12px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--text-dim)}
.live{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:var(--surface);border:1px solid var(--border);backdrop-filter:blur(10px)}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 var(--good);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:6px 12px;font:500 12.5px var(--sans);cursor:pointer;transition:.15s}
.btn:hover{transform:translateY(-1px);border-color:var(--brand);text-decoration:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);padding:22px;animation:rise .5s both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.card h2{margin:0 0 2px;font-size:15px;font-weight:650;letter-spacing:-.01em}
.card .sub{color:var(--text-faint);font-size:12.5px;margin:0 0 16px}
.grid{display:grid;gap:16px;margin-bottom:16px}
.g-hero{grid-template-columns:1.5fr 1fr}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(176px,1fr))}
.g-2{grid-template-columns:1.6fr 1fr}
.g-eq{grid-template-columns:1fr 1fr}
@media(max-width:900px){.g-hero,.g-2,.g-eq{grid-template-columns:1fr}}
.grad{background:linear-gradient(120deg,var(--brand),var(--brand-2));-webkit-background-clip:text;background-clip:text;color:transparent}

/* hero */
.verdict{display:flex;gap:20px;align-items:flex-start;position:relative;overflow:hidden}
.verdict.good{--vc:var(--good)}.verdict.warn{--vc:var(--warn)}.verdict.bad{--vc:var(--bad)}
.v-badge{flex:none;border-radius:18px;padding:16px 16px;text-align:center;min-width:118px}
.v-badge .v-ic{font-size:30px;line-height:1;font-weight:700}
.v-badge .v-t{font-weight:800;font-size:14px;margin-top:8px;letter-spacing:.06em}
.v-good{background:var(--good-soft);color:var(--good)}.v-warn{background:var(--warn-soft);color:var(--warn)}.v-bad{background:var(--bad-soft);color:var(--bad)}
.v-body{position:relative;z-index:1}
.v-body h2{font-size:22px;margin-bottom:6px;letter-spacing:-.02em}
.v-body p{margin:0 0 14px;color:var(--text-dim)}
.gates{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
@media(max-width:620px){.gates{grid-template-columns:1fr}.verdict{flex-direction:column}}
.gate{display:flex;gap:9px;align-items:flex-start;font-size:13px}
.gate i{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;margin-top:1px}
.gate .ok{background:var(--good-soft);color:var(--good)}.gate .wn{background:var(--warn-soft);color:var(--warn)}.gate .no{background:var(--bad-soft);color:var(--bad)}
.gate span{color:var(--text-faint);display:block;font-size:12px}
.score{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring{position:relative;width:178px;height:178px}
.ring svg{transform:rotate(-90deg)}
.ring .arc{transition:stroke-dasharray 1.2s cubic-bezier(.2,.8,.2,1)}
.ring .n{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .n b{font-size:46px;font-weight:800;letter-spacing:-.04em;line-height:1}
.ring .n small{color:var(--text-faint);font-size:12px;margin-top:4px}
.score .cap{margin-top:12px;color:var(--text-dim);font-size:12.5px;max-width:270px}

/* kpi */
.kpi{padding:18px;transition:.2s}.kpi:hover{transform:translateY(-3px)}
.kpi .l{color:var(--text-faint);font-size:12px;font-weight:500;margin-bottom:6px}
.kpi .v{font-size:30px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .d{font-size:12px;margin-top:6px;color:var(--text-faint)}
.kpi .d.up{color:var(--good)}.kpi .d.dn{color:var(--bad)}
.kpi svg{display:block;margin-top:10px;width:100%;height:32px}

.pill{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:11.5px;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.mute{background:var(--surface-2);color:var(--text-faint)}.pill.brand{background:var(--brand-soft);color:var(--brand)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:90px}
.bar>div{height:100%;border-radius:99px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.c-good{color:var(--good)}.c-warn{color:var(--warn)}.c-bad{color:var(--bad)}.c-faint{color:var(--text-faint)}
.bg-good{background:linear-gradient(90deg,var(--good),#6ee7b7)}.bg-warn{background:linear-gradient(90deg,var(--warn),#fde68a)}.bg-bad{background:linear-gradient(90deg,var(--bad),#fda4af)}
.num{font-variant-numeric:tabular-nums}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--text-dim);font:500 12.5px var(--sans);padding:5px 12px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface-solid);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px}

.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.feat{border:1px solid var(--border);border-radius:16px;padding:16px;background:var(--surface-2);cursor:pointer;transition:.2s;text-align:left;font:inherit;color:inherit;width:100%}
.feat:hover,.feat:focus-visible{transform:translateY(-3px);border-color:var(--brand);outline:0;box-shadow:0 10px 26px rgba(29,78,216,.22)}
.feat .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.feat b{font-weight:650}
.feat .big{font-size:28px;font-weight:800;letter-spacing:-.03em;margin-bottom:8px}
.feat .meta{display:flex;justify-content:space-between;color:var(--text-faint);font-size:12px;margin-top:8px}
.feat .more{color:var(--brand);font-size:12px;margin-top:10px;font-weight:600}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--text-faint);font-weight:500;font-size:12px;padding:0 12px 10px 0;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 12px 11px 0;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.mono{font-family:var(--mono);font-size:12px}
.item{padding:12px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.item:last-child{border:0;padding-bottom:0}.item:first-of-type{padding-top:0}
.item .t{font-weight:550}.item .s{color:var(--text-faint);font-size:12px;word-break:break-word}
.empty{color:var(--text-faint);padding:18px;background:var(--surface-2);border-radius:12px;text-align:center}
.legend{display:flex;gap:16px;font-size:12px;color:var(--text-dim);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--text-faint);font:11px var(--sans)}
.chart circle{transition:r .15s}.chart circle:hover{r:7}
.tip{position:fixed;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;padding:6px 10px;border-radius:8px;opacity:0;transition:opacity .1s;z-index:30;white-space:nowrap}
.chg{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.chg:last-child{border:0}.chg .tag{flex:none;margin-top:1px}
.dots{display:inline-flex;gap:4px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dot.expected{background:var(--good)}.dot.flaky{background:var(--warn)}.dot.unexpected{background:var(--bad)}.dot.skipped{background:var(--text-faint);opacity:.5}.dot.none{background:transparent;border:1px dashed var(--text-faint)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11.5px;padding:2px 8px;border-radius:8px;background:var(--surface-2);color:var(--text-dim)}
details.run>summary{list-style:none;cursor:pointer}details.run>summary::-webkit-details-marker{display:none}
.runrow{display:grid;grid-template-columns:70px 1.1fr 1fr 90px 90px 80px 84px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.runrow:hover{background:var(--surface-2)}
@media(max-width:820px){.runrow{grid-template-columns:60px 1fr 80px 70px}.runrow>:nth-child(3),.runrow>:nth-child(5),.runrow>:nth-child(6){display:none}}
.rundet{padding:4px 0 16px 70px}
@media(max-width:820px){.rundet{padding-left:0}}
/* modal */
dialog{border:1px solid var(--border);border-radius:22px;background:var(--surface-solid);color:var(--text);padding:0;width:min(900px,94vw);max-height:86vh;box-shadow:0 30px 80px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(5,8,22,.6);backdrop-filter:blur(4px)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:20px 22px 12px;position:sticky;top:0;background:var(--surface-solid);z-index:1}
.dlg-b{padding:0 22px 22px;overflow:auto;max-height:calc(86vh - 70px)}
details.gdet{margin-top:14px}details.gdet>summary{cursor:pointer;color:var(--brand);font-weight:600;font-size:12.5px;list-style:none}details.gdet>summary::-webkit-details-marker{display:none}
details.gdet .gates{margin-top:12px}
.brief{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:2px 0 4px}
@media(max-width:700px){.brief{grid-template-columns:1fr}}
.bf{border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--surface-2)}
.bf .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);font-weight:600}
.bf .x{font-weight:650;margin-top:2px}.bf .y{font-size:12px;color:var(--text-dim)}
.next{margin-top:12px;padding:10px 12px;border-radius:12px;font-size:13px;font-weight:550}
.next.good{background:var(--good-soft);color:var(--good)}.next.warn{background:var(--warn-soft);color:var(--warn)}.next.bad{background:var(--bad-soft);color:var(--bad)}
.sev{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:6px}
.sev.critical{background:var(--bad-soft);color:var(--bad)}.sev.high{background:var(--warn-soft);color:var(--warn)}.sev.medium{background:var(--brand-soft);color:var(--brand)}.sev.low{background:var(--surface-2);color:var(--text-dim)}
.deltas{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:14px}
.dl{border:1px solid var(--border);border-radius:12px;padding:8px 10px;background:var(--surface-2)}
.dl .k{font-size:11px;color:var(--text-faint)}.dl .x{font-weight:700;font-size:15px}.dl .y{font-size:11.5px}
.chg-h{display:flex;justify-content:space-between;font-size:12px;font-weight:650;color:var(--text-dim);margin:14px 0 2px;text-transform:uppercase;letter-spacing:.05em}
footer{margin-top:28px;text-align:center;color:var(--text-faint);font-size:12px}
@media print{.actions .btn,.seg{display:none}body{background:#fff}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Enterprise SaaS style (Atlassian / Datadog-like): slate neutrals, one blue accent, dark top bar ===== */
:root{--bg:#f4f6f9;--surface:#fff;--surface-solid:#fff;--surface-2:#f7f8fa;--border:#dfe3ea;
  --text:#172b4d;--text-dim:#44546f;--text-faint:#6b778c;--brand:#0c66e4;--brand-2:#1d7afc;--brand-soft:#e9f2ff;
  --good:#1f845a;--good-soft:#dcfff1;--warn:#a54800;--warn-soft:#fff7d6;--bad:#c9372c;--bad-soft:#ffeceb;--shadow:0 1px 1px rgba(9,30,66,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101214;--surface:#161a1d;--surface-solid:#161a1d;--surface-2:#1d2125;--border:#2c333a;
  --text:#c7d1db;--text-dim:#9fadbc;--text-faint:#8c9bab;--brand:#579dff;--brand-2:#85b8ff;--brand-soft:#09326c;
  --good:#4bce97;--good-soft:#1c3329;--warn:#e2b203;--warn-soft:#38300a;--bad:#f87168;--bad-soft:#42221f;
  --shadow:none;color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#101214;--surface:#161a1d;--surface-solid:#161a1d;--surface-2:#1d2125;--border:#2c333a;
  --text:#c7d1db;--text-dim:#9fadbc;--text-faint:#8c9bab;--brand:#579dff;--brand-2:#85b8ff;--brand-soft:#09326c;
  --good:#4bce97;--good-soft:#1c3329;--warn:#e2b203;--warn-soft:#38300a;--bad:#f87168;--bad-soft:#42221f;
  --shadow:none;color-scheme:dark;}
.wrap{max-width:none;width:100%;padding:28px clamp(16px,2.2vw,40px) 64px}
.top{margin-bottom:20px}
.logo{width:34px;height:34px}
h1{font-size:19px;font-weight:700;letter-spacing:-.015em}
.live{background:var(--surface);border-radius:8px;backdrop-filter:none}
.btn{border-radius:8px;background:var(--surface);padding:6px 12px}
.btn:hover{transform:none;border-color:var(--text-faint)}
.card{border-radius:14px;padding:20px;animation:none}
.card h2{font-size:14.5px;font-weight:700}
.card .sub{font-size:12.5px;margin-bottom:14px}
.grid{gap:14px;margin-bottom:14px}
.kpi{padding:16px 18px}.kpi:hover{transform:none;border-color:var(--text-faint)}
.kpi .l{font-size:12.5px;font-weight:500;color:var(--text-dim)}
.kpi .v{font-size:28px;font-weight:700}
.kpi svg polyline{stroke:var(--brand)}
.v-badge{border-radius:12px}
.v-body h2{font-size:20px}
.bf,.dl,.feat{border-radius:12px;background:var(--surface-2)}
.feat:hover,.feat:focus-visible{transform:none;box-shadow:none;border-color:var(--brand)}
.pill,.sev,.chip{border-radius:6px}
.seg{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:3px}
.seg button{border-radius:7px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--text);box-shadow:none}
.bar{height:9px;border-radius:99px;background:var(--surface-2)}
.bg-good{background:var(--brand)}.bg-warn{background:var(--warn)}.bg-bad{background:var(--bad)}
th{font-size:12px;font-weight:600;color:var(--text-faint);padding-bottom:12px}
td{padding:13px 12px 13px 0}
.runrow:hover{background:transparent}
dialog{border-radius:16px;box-shadow:0 24px 64px rgba(0,0,0,.5)}
.chart text{fill:var(--text-faint)}

/* hover effects (flat style: border + glow + small lift; remove this block to revert) */
@media (hover:hover){
  .card,.kpi,.feat,.bf,.dl,.btn,.chip,.pill,.gate,.item,.chg,.runrow,tbody tr td,.seg button,.logo,.ring,.v-badge,.bar>div,.kpi svg polyline{
    transition:transform .18s ease,border-color .18s ease,box-shadow .2s ease,background-color .18s ease,color .18s ease,filter .2s ease,stroke-width .18s ease}
  .card:hover{border-color:color-mix(in srgb,var(--brand) 45%,var(--border));box-shadow:0 8px 28px -10px color-mix(in srgb,var(--brand) 40%,transparent)}
  .kpi{position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--brand);transform:scaleX(0);transform-origin:0 50%;transition:transform .3s ease}
  .kpi:hover{transform:translateY(-3px);border-color:var(--brand);box-shadow:0 12px 28px -12px color-mix(in srgb,var(--brand) 55%,transparent)}
  .kpi:hover::before{transform:scaleX(1)}
  .kpi:hover svg polyline{stroke-width:3;filter:drop-shadow(0 0 4px var(--brand))}
  .feat:hover,.feat:focus-visible{transform:translateY(-3px);border-color:var(--brand);box-shadow:0 0 0 1px var(--brand),0 14px 30px -14px color-mix(in srgb,var(--brand) 60%,transparent)}
  .feat:hover .bar>div{filter:brightness(1.15)}
  .feat:hover .more,.feat:hover .big{letter-spacing:0}
  .feat .more{display:inline-block;transition:transform .18s ease}.feat:hover .more{transform:translateX(4px)}
  .btn:hover{background:var(--surface-2);border-color:var(--brand);transform:translateY(-1px);box-shadow:0 6px 16px -8px color-mix(in srgb,var(--brand) 55%,transparent)}
  .btn:active{transform:translateY(0) scale(.97)}
  .seg button:hover:not([aria-pressed="true"]){background:var(--surface-2);color:var(--text)}
  .bf:hover,.dl:hover,.chip:hover{border-color:color-mix(in srgb,var(--brand) 50%,var(--border));background:color-mix(in srgb,var(--brand) 8%,var(--surface-2));transform:translateY(-1px)}
  .gate:hover{transform:translateX(3px)}
  .pill:hover,.sev:hover{filter:brightness(1.2);transform:translateY(-1px)}
  .logo:hover{transform:rotate(-6deg) scale(1.06)}
  .ring:hover{transform:scale(1.04)}.ring:hover svg{filter:drop-shadow(0 0 12px color-mix(in srgb,var(--brand) 55%,transparent))}
  .v-badge:hover{transform:scale(1.04)}
  .bar:hover>div{filter:brightness(1.2)}
  tbody tr:hover td{background:color-mix(in srgb,var(--brand) 7%,transparent)}
  tbody tr:hover td:first-child{border-top-left-radius:8px;border-bottom-left-radius:8px;box-shadow:inset 2px 0 0 var(--brand);padding-left:8px}
  tbody tr:hover td:last-child{border-top-right-radius:8px;border-bottom-right-radius:8px}
  .runrow:hover{background:color-mix(in srgb,var(--brand) 7%,transparent);border-radius:8px;padding-left:10px;padding-right:10px}

/* ===== v2: toolbar, heatmap, matrix, explorer, skeleton, toast, print brief ===== */

/* heatmap */

.hm{width:15px;height:22px;border:0;padding:0;border-radius:4px;cursor:pointer;background:var(--surface-2)}

/* browser matrix */

.mx-c.weak{outline:2px solid currentColor;outline-offset:1px}

/* failure causes */
.legend i.sq{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.cause{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:6px;background:var(--surface-2)}

.errbox{font:12px/1.5 var(--mono);background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;white-space:pre-wrap;word-break:break-word;color:var(--text-dim)}
.dlg-sec{margin:16px 0 8px;font-size:12px;font-weight:650;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em}
.short li{margin:6px 0}.short{padding-left:0;list-style:none}

/* skeleton, toast */
.skel{display:grid;gap:14px}.skel div{border-radius:14px;background:linear-gradient(90deg,var(--surface) 25%,var(--surface-2) 50%,var(--surface) 75%);background-size:200% 100%;animation:skel 1.4s infinite linear;border:1px solid var(--border)}
@keyframes skel{to{background-position:-200% 0}}

.print-only{display:none}

.grid>*{min-width:0}.item>div:first-child{min-width:0;flex:1}.item .pill{flex:none}.item .s,.item .t{overflow-wrap:anywhere}.mx-h{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* filters: env counts, custom dates, period summary */
.seg{flex-wrap:wrap}.seg button.nodata{opacity:.5}.seg button.nodata[aria-pressed="true"]{opacity:.85}
.daterange{display:inline-flex;align-items:center;gap:8px}
.daterange input{background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:5px 8px;font:500 12.5px var(--sans)}
.daterange input:focus{outline:2px solid var(--brand);outline-offset:1px}

/* mobile pass */

<body>
<div class="wrap" id="app"><div class="skel" aria-busy="true" aria-label="Loading dashboard"><div style="height:56px"></div><div style="height:260px"></div><div style="height:130px"></div><div style="height:240px"></div></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div class="tip" id="tip"></div>
<dialog id="dlg"><div class="dlg-h"><h2 id="dlg-t" style="margin:0;font-size:18px"></h2><button class="btn" id="dlg-x">Close ✕</button></div><div class="dlg-b" id="dlg-b"></div></dialog>
<script>
/* ---- Release gates & thresholds: edit these to match your release policy ---- */
const POLICY = {
  // Release criteria in the style most QA teams use: smoke and critical / high-severity cases decide the release,
  // medium and low failures are "known issues" that can be signed off. Edit the numbers to match your policy.
  regression: { pass: 95, warn: 85 },   // overall pass rate of the latest full regression: >= pass is green, >= warn is amber, below is a blocker
  highSeverity: { pass: 100, block: 90 }, // any critical failure blocks; high-severity pass rate: 100% green, >= block amber, below block is a blocker
  minor:      { medium: 90, low: 80 },  // medium / low pass rates below these are amber (known issues), never a blocker
  flake:      { pass: 5,  warn: 10 },   // % of checks that needed a retry: <= pass green, <= warn amber, above is a blocker
  feature:    { pass: 85, warn: 70 },   // lowest feature pass rate
  browser:    { pass: 90, warn: 80 },   // lowest browser/device pass rate
  severity:   { critical: { pass: 100, warn: 90 }, high: { pass: 100, warn: 90 }, medium: { pass: 90, warn: 75 }, low: { pass: 80, warn: 60 } }, // colours of the severity tiles
  drop:       5                         // pts drop vs the previous full run that triggers a warning
};
const FEATURE_NAMES = { login: 'Login & Authentication', cart: 'Shopping Cart', checkout: 'Checkout & Payment', accessibility: 'Accessibility (WCAG)', inventory: 'Product Listing', 'product-details': 'Product Details', 'menu-navigation': 'Menu & Navigation', 'dynamic-catalog': 'Dynamic Catalog', 'user-profiles': 'User Profiles' };
const BROWSER_NAMES = { chromium: 'Chrome (desktop)', firefox: 'Firefox (desktop)', webkit: 'Safari (desktop)', 'mobile-chrome': 'Chrome (Android phone)' };
const SEVS = ['critical', 'high', 'medium', 'low'];
const sevPill = (k) => `<span class="sev ${esc(k)}">${esc(k)}</span>`;
// The Allure report is published at the site root; the dashboard lives in /dashboard/ beneath it.
const ALLURE_URL = (() => { const m = location.pathname.match(/^(.*\/)dashboard\//); return m ? m[1] : '../'; })();

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nice = (k) => FEATURE_NAMES[k] ?? k.replace(/[-_]/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());
const niceB = (k) => BROWSER_NAMES[k] ?? k;
const blank = { total: 0, passed: 0, failed: 0, flaky: 0, skipped: 0 };
const ran = (b) => b.total - b.skipped;
const rate = (b) => (ran(b) ? Math.round(((b.passed + b.flaky) / ran(b)) * 1000) / 10 : null);
const tone = (p, t = { pass: 95, warn: 85 }) => (p === null ? 'mute' : p >= t.pass ? 'good' : p >= t.warn ? 'warn' : 'bad');
const TXT = { good: 'Healthy', warn: 'Needs attention', bad: 'At risk', mute: 'Not run' };
const pct = (n) => (n === null ? '–' : `${n}%`);
const dur = (ms) => { const s = Math.round(ms / 1000); return s >= 60 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${s}s`; };
const when = (d) => new Date(d).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
const flakeRate = (r) => (ran(r) ? Math.round((r.flaky / ran(r)) * 1000) / 10 : 0);
const smokeOf = (r) => r.smoke ?? blank;
const isFull = (r) => (r.scope ? r.scope === 'full' : true);
const scopeLabel = (r) => (isFull(r) ? 'Full' : r.scope === 'partial' ? [r.suite && r.suite !== 'Full Regression' && r.suite, r.filter].filter(Boolean).join(' · ') || 'Partial' : 'Smoke');

function healthScore(r, fullRun) {
  const reg = rate(fullRun ?? r) ?? 0, sm = rate(smokeOf(r)) ?? reg;
  return Math.max(0, Math.round(reg * 0.5 + sm * 0.25 + (100 - Math.min(100, flakeRate(r) * 5)) * 0.25));
}

function spark(vals, color) {
  const v = vals.filter((x) => x !== null && x !== undefined);
  if (v.length < 2) return '';
  const min = Math.min(...v), max = Math.max(...v), span = max - min || 1;
  const pts = v.map((y, i) => `${(i / (v.length - 1)) * 100},${26 - ((y - min) / span) * 22}`).join(' ');
  return `<svg viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--${color})" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
const dlt = (cur, prev, unit = '', goodUp = true) => {
  if (prev === null || prev === undefined || cur === null) return '<div class="d">First data point</div>';
  const d = Math.round((cur - prev) * 10) / 10;
  if (!d) return '<div class="d">No change vs previous</div>';
  return `<div class="d ${(d > 0) === goodUp ? 'up' : 'dn'}">${d > 0 ? '▲' : '▼'} ${Math.abs(d)}${unit} vs previous</div>`;
};

/* ---- release readiness ---- */
function readiness(runs) {
  const latest = runs[0];
  const full = runs.find(isFull) ?? latest;
  const prevFull = runs.filter(isFull).find((r) => r !== full);
  const gates = [];
  // short = the phrase used in the one-line verdict explanation
  const g = (name, status, detail, short) => gates.push({ name, status, detail, short: short ?? detail });

  const xl = [0, Math.floor((pts.length - 1) / 2), pts.length - 1].map((i) => `<text x="${X(i)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === pts.length - 1 ? 'end' : 'middle'}">#${esc(pts[i].runNumber)}</text>`).join('');
  const lines = series.map((s) => {
    let d = '', dots = '';
    pts.forEach((r, i) => {
      const v = s.val(r); if (v === null) return;
      d += `${d ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)} `;
      dots += `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="4" fill="var(--${s.color})" stroke="var(--surface)" stroke-width="2" data-tip="${esc(`${s.name} · run #${r.runNumber} · ${v}% · ${when(r.date)}`)}"/>`;
    });
    return `<path d="${d}" fill="none" stroke="var(--${s.color})" stroke-width="2.5" stroke-linejoin="round"/>${dots}`;
  }).join('');
  return `<div class="legend">${series.map((s) => `<span><i style="background:var(--${s.color})"></i>${s.name}</span>`).join('')}</div>
  <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pass rate trend over the last ${pts.length} runs">${grid.join('')}${xl}${lines}</svg>`;
}

const EXP_RANK = { unexpected: 0, flaky: 1, expected: 2, skipped: 3, none: 4 }; // problem checks first

/* ---- failure / check detail panel ---- */
function openTest(k, run) {
  if (!run) return;
  const sep = k.indexOf('|'), feature = k.slice(0, sep), title = k.slice(sep + 1);
  const same = (f) => f.feature === feature && f.title === title;
  const fails = (run.failedTests ?? []).filter(same), flakes = (run.flakyTests ?? []).filter(same);
  const issue = fails[0] ?? flakes[0];
  const t = IDX.get(run)?.get(k) ?? { feature, title, severity: issue?.severity ?? 'medium', smoke: false, results: {} };
  const projects = Object.keys(t.results).length ? Object.keys(t.results) : [...new Set([...fails, ...flakes].map((f) => f.project))];
  const status = fails.length ? 'unexpected' : flakes.length ? 'flaky' : 'expected';
  // An unstable check passed on retry, so the generic "behaves differently" wording would be wrong for it.
  const info = status === 'flaky' ? { label: 'Intermittent failure', confidence: 'Medium', owner: 'QA',
      meaning: 'The check failed on its first attempt and passed on the retry. The usual causes are timing, shared test data or an unstable environment.',
      action: 'Find out why it fails intermittently instead of re-running it. Check the waits, the data set-up and the environment.' }
    : issue ? run.causes?.[issue.category] : null;
  const trace = fails.find((f) => f.traceUrl);
  const h = histOf(VIEW_RUNS, k);
  const seen = h.filter(Boolean).length, bad = h.filter((v) => v === 'unexpected').length, flk = h.filter((v) => v === 'flaky').length;
  const reliab = seen ? Math.round(((seen - bad - flk) / seen) * 100) : null, rt = tone(reliab, { pass: 95, warn: 80 });
  const mx = (x) => Math.max(...Object.values(x.results).map((y) => y[1]));
  const durs = [...VIEW_RUNS].reverse().map((r) => { const x = IDX.get(r)?.get(k); return x ? mx(x) : null; });
  const times = projects.map((p) => t.results[p]?.[1] ?? 0), slowest = Math.max(...times, 0), fastest = Math.min(...times.filter(Boolean), slowest || 0);
  const failedOn = projects.filter((p) => (t.results[p]?.[0] ?? (fails.some((f) => f.project === p) ? 'unexpected' : 'none')) === 'unexpected');
  const banner = status === 'unexpected' ? [`Failing on ${failedOn.length} of ${projects.length} browser${projects.length === 1 ? '' : 's'}`, 'bad', info?.label ?? 'Needs investigation']
    : status === 'flaky' ? ['Unstable: failed first, then passed on retry', 'warn', info?.label ?? 'Intermittent'] : [`Passing on ${projects.length === 1 ? 'the browser' : 'every browser'}`, 'good', 'No action needed'];
  const dots = { High: 3, Medium: 2, Low: 1 }[info?.confidence] ?? 0;
  const cmd = `npx playwright test -g "${title.replace(/(["\\$`])/g, '\\$1')}"${failedOn[0] ? ` --project=${failedOn[0]}` : ''}`;
  const tags = [feature === 'accessibility' ? 'a11y' : feature.split('-')[0], t.severity ?? 'medium', ...(t.smoke ? ['smoke'] : []), ...(title.startsWith('[Demo]') ? ['demo-failure'] : [])];
  const cmp = issue?.expected && issue?.received ? `<div class="fa-cmp"><div class="fa-exp"><span>Expected</span><b>${esc(issue.expected)}</b></div><div class="fa-act"><span>Actual</span><b>${esc(issue.received)}</b></div></div>` : '';
  document.getElementById('dlg-t').textContent = title;
  document.getElementById('dlg-b').innerHTML = `
    <div class="td-top"><div class="chips">${sevPill(t.severity ?? 'medium')}<span class="chip">${esc(nice(feature))}</span><span class="pill ${t.smoke ? 'brand' : 'mute'}">${t.smoke ? 'Smoke' : 'Regression'}</span>${title.startsWith('[Demo]') ? '<span class="pill warn">Intentional demo failure</span>' : ''}</div>
      <div class="td-tags">${tags.map((x) => `<span class="td-tag">@${esc(x)}</span>`).join('')}</div></div>
    <div class="td-banner td-${banner[1]}"><div><b>${esc(banner[0])}</b><span>${esc(banner[2])}</span></div><span class="pill ${ST[status][0]}">${ST[status][1]}</span></div>
    <div class="td-facts">
      <div class="td-fact"><span>Reliability</span><b class="c-${rt}">${reliab === null ? '–' : reliab + '%'}</b><small>${seen ? `clean in ${seen - bad - flk} of ${seen} runs` : 'no history yet'}</small></div>
      <div class="td-fact"><span>Failed runs</span><b class="${bad ? 'c-bad' : ''}">${bad}</b><small>of ${seen || '–'} with detail</small></div>
      <div class="td-fact"><span>Flaky runs</span><b class="${flk ? 'c-warn' : ''}">${flk}</b><small>passed only on retry</small></div>
      <div class="td-fact"><span>Slowest browser</span><b>${slowest ? (slowest / 1000).toFixed(1) + 's' : '–'}</b><small>${fastest && fastest !== slowest ? `fastest ${(fastest / 1000).toFixed(1)}s` : 'this run'}</small></div></div>
    <div class="td-cols">
      <div><div class="dlg-sec">Result by browser</div><div class="td-br">${projects.map((p) => { const x = t.results[p], f = fails.find((y) => y.project === p) ?? flakes.find((y) => y.project === p), st = x ? x[0] : f ? (fails.includes(f) ? 'unexpected' : 'flaky') : 'none';
        return `<div class="td-b"><span class="dot ${st}"></span><b>${esc(niceB(p))}</b><span class="pill ${ST[st][0]}">${ST[st][1]}</span><span class="td-bar"><i style="width:${slowest && x ? Math.max(6, (x[1] / slowest) * 100) : 0}%"></i></span><span class="num td-t">${x ? (x[1] / 1000).toFixed(1) + 's' : '–'}</span></div>`; }).join('') || '<div class="empty">No result recorded for this check.</div>'}</div></div>
      <div><div class="dlg-sec">Run history · oldest → newest</div>${h.some(Boolean) ? strip(h) : '<div class="muted-sm">History appears once runs include check detail.</div>'}
        <div class="dlg-sec">Time per run</div>${durs.filter((x) => x !== null).length > 1 ? `<div class="td-spark">${sparkArea(durs, 'brand', 'td')}</div>` : '<div class="muted-sm">Needs two runs with timing.</div>'}</div></div>
    ${issue ? `<div class="dlg-sec">Why it ${status === 'flaky' ? 'is unstable' : 'failed'}</div>${cmp}
      <ol class="fa-steps">
        <li><i>1</i><div><b>What happened</b><p>${esc(issue.what ?? issue.error ?? 'No message recorded.')}</p></div></li>
        <li><i>2</i><div><b>Likely cause</b>${info?.confidence ? `<span class="fa-conf"><u class="${dots > 0 ? 'on' : ''}"></u><u class="${dots > 1 ? 'on' : ''}"></u><u class="${dots > 2 ? 'on' : ''}"></u> ${esc(info.confidence)} confidence</span>` : ''}<p>${esc(info?.meaning ?? issue.hint ?? 'Open the trace for details.')}</p></div></li>
        <li><i>3</i><div><b>Suggested next step</b><p>${esc(info?.action ?? 'Open the Allure report for the screenshot and trace.')}</p>${info?.owner ? `<span class="chip">Owner · ${esc(info.owner)}</span>` : ''}</div></li></ol>
      ${fails.length ? `<details class="gdet"><summary>Raw error from the test run ▾</summary>${fails.map((f) => `<div class="errbox" style="margin-top:8px"><b>${esc(niceB(f.project))}</b>\n${esc(f.error ?? 'No error message recorded.')}${f.file ? `\n\n${esc(f.file)}` : ''}</div>`).join('')}</details>` : ''}` : ''}
    <div class="dlg-sec">Investigate</div>
    <div class="td-actions"><a class="btn btn-primary" href="${ALLURE_URL}" target="_blank" rel="noopener">Open Allure report ↗</a>
      ${run.runUrl ? `<a class="btn" href="${esc(run.runUrl)}" target="_blank" rel="noopener">Open CI run ↗</a>` : ''}
      ${trace ? `<a class="btn" href="${esc(trace.traceUrl)}" target="_blank" rel="noopener">Open trace ↗</a>` : ''}
      <button class="btn" data-act="copy" data-copy="${esc(title)}">Copy name</button></div>
    <div class="td-cmd"><span class="mono">${esc(cmd)}</span><button class="btn" data-act="copy" data-copy="${esc(cmd)}">Copy command</button></div>
    ${fails.length && !trace ? `<p class="muted-sm" style="margin:10px 0 0">Traces of retried failures are saved as the <b>traces-${esc(fails[0].project)}</b> artifact of the CI run. Unzip it and run <span class="mono">npx playwright show-trace trace.zip</span>.</p>` : ''}`;
  document.getElementById('dlg').showModal();
}

  const say = (list) => { const t = list.slice(0, 2).map((x) => x.short).join(' and '); return t[0].toUpperCase() + t.slice(1); };

const sparkArea = (vals, tn, id) => {

  if (v.length < 2) return '<svg class="m-spark" viewBox="0 0 100 36" aria-hidden="true"></svg>';
  const min = Math.min(...v), max = Math.max(...v), span = max - min || 1;
  const pts = v.map((y, i) => [(i / (v.length - 1)) * 100, max === min ? 18 : 30 - ((y - min) / span) * 24]);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  return `<svg class="m-spark" viewBox="0 0 100 36" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="sg-${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--${tn})" stop-opacity=".38"/><stop offset="1" stop-color="var(--${tn})" stop-opacity="0"/></linearGradient></defs>
    <path d="${line} L100,36 L0,36 Z" fill="url(#sg-${id})"/><path d="${line}" fill="none" stroke="var(--${tn})" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
};
function heroKpis(c) {

    const x = Math.round((cur - prev) * 10) / 10;
    return x ? { txt: `${x > 0 ? '▲' : '▼'} ${Math.abs(x)}${unit}`, cls: (x > 0) === goodUp ? 'up' : 'dn' } : { txt: 'no change', cls: 'flat' };
  };
  const ft = fl <= POLICY.flake.pass ? 'good' : fl <= POLICY.flake.warn ? 'warn' : 'bad';
  return [
    { l: 'Regression pass rate', v: reg, dec: 1, suf: '%', tn: tone(reg, { pass: POLICY.regression.pass, warn: POLICY.regression.warn }), dl: d(reg, prevFull ? rate(prevFull) : null, ' pts', true), sp: fullHist.map(rate) },
    { l: 'Smoke pass rate', v: sm, dec: 1, suf: '%', tn: tone(sm, { pass: 100, warn: 90 }), dl: d(sm, prevFull ? rate(smokeOf(prevFull)) : null, ' pts', true), sp: fullHist.map((r) => rate(smokeOf(r))) },
    { l: 'Failing checks', v: full.failed, dec: 0, suf: '', tn: full.failed ? 'bad' : 'good', dl: d(full.failed, prevFull?.failed, '', false), sp: fullHist.map((r) => r.failed) },
    { l: 'Flaky rate', v: fl, dec: 1, suf: '%', tn: ft, dl: d(fl, prevFull ? flakeRate(prevFull) : null, ' pts', false), sp: fullHist.map(flakeRate) },

    const changed = !ALL.length || data.length !== ALL.length || data[0]?.id !== ALL[0]?.id || data[0]?.date !== ALL[0]?.date;
    ALL = data;
    if (!envExplicit && view.env === 'all') view.env = defaultEnv();

  if (ev.target.id === 'dlg') { ev.target.close(); return; }
  const c = ev.target.closest('[data-act="copy"]'); // the dialog sits outside #app, so it handles its own copy buttons
  if (c) (navigator.clipboard?.writeText(c.dataset.copy) ?? Promise.reject()).then(() => toast('Copied to the clipboard')).catch(() => toast('Could not copy. Select the text and copy it manually.'));
});

load();
setInterval(() => { if (!document.hidden && !document.getElementById('dlg').open) load(); }, 300000); // auto-refresh every 5 min
setInterval(() => { const el = document.getElementById('fresh'); if (el && ALL[0]) { el.textContent = `Updated ${ago(ALL[0].date)}`; el.className = `fresh fresh-${freshTone(ALL[0].date)}`; } }, 60000);
</script>
</body>
</html>
