name: Playwright E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *' # nightly regression run, 03:00 UTC
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test (URLs come from repo variables QA_URL, DEV_URL, STAGING_URL, PROD_URL)'
        required: true
        default: QA
        type: choice
        options:
          - QA
          - DEV
          - STAGING
          - PROD
      suite:
        description: 'Which suite to run (ignored when "grep" is set)'
        required: true
        default: Full Regression
        type: choice
        options:
          - Smoke
          - Full Regression
      base_url:
        description: 'Advanced: override the environment URL for this run'
        required: false
        default: ''
      grep:
        description: 'Only run tests whose title matches this pattern (overrides "suite" below)'
        required: false
        default: ''
      requested_by:
        description: 'Who asked for this run (set automatically by the Slack /qa-run command)'
        required: false
        default: ''

concurrency:
  # manual / Slack-triggered runs get their own group so they never cancel (or get cancelled by) a push run
  group: playwright-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  # Manual runs pick an environment; its URL comes from a repo variable. Falls back to BASE_URL, then the public demo site.
  BASE_URL: >-
    ${{ github.event.inputs.base_url
    || (github.event.inputs.environment == 'QA' && vars.QA_URL)
    || (github.event.inputs.environment == 'DEV' && vars.DEV_URL)
    || (github.event.inputs.environment == 'STAGING' && vars.STAGING_URL)
    || (github.event.inputs.environment == 'PROD' && vars.PROD_URL)
    || vars.BASE_URL || 'https://www.saucedemo.com' }}
  TEST_ENV: ${{ github.event.inputs.environment || 'Default' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

  test:
    name: Test (${{ matrix.project }})
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-chrome]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Determine test scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          INPUT_GREP: ${{ github.event.inputs.grep }}
          INPUT_SUITE: ${{ github.event.inputs.suite }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "grep=@smoke" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_GREP" ]; then
            echo "grep=$INPUT_GREP" >> "$GITHUB_OUTPUT"
          elif [ "$INPUT_SUITE" = "Smoke" ]; then
            echo "grep=@smoke" >> "$GITHUB_OUTPUT"
          else
            echo "grep=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Playwright tests
        env:
          BASE_URL: ${{ env.BASE_URL }}
          GREP: ${{ steps.scope.outputs.grep }}
        run: |
          if [ -n "$GREP" ]; then
            npx playwright test --project=${{ matrix.project }} --grep "$GREP"
          else
            npx playwright test --project=${{ matrix.project }}
          fi

      - name: Job summary
        if: always()
        uses: daun/playwright-report-summary@v4
        with:
          report-file: test-results/results.json
          job-summary: true
          comment: false

      - name: Flaky test report
        if: always()
        run: node scripts/report-flaky.js test-results/results.json

      - name: Analyze results (rule-based)
        if: always()
        run: node scripts/analyze-results.js test-results/results.json test-results/analysis.json

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

      - name: Upload analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-report-${{ matrix.project }}
          path: test-results/analysis.html
          if-no-files-found: ignore

      - name: Upload JSON results (for QA dashboard)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: json-results-${{ matrix.project }}
          path: test-results/results.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results/
          retention-days: 14

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-${{ matrix.project }}
          path: test-results/
          retention-days: 7

  report:
    name: Merge Allure report
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Allure results from all projects
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Fetch previous Allure history (for trend charts)
        continue-on-error: true
        run: |
          mkdir -p allure-results/history
          base_url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/history"
          for file in history.json history-trend.json categories-trend.json duration-trend.json retry-trend.json; do
            curl -sSf "$base_url/$file" -o "allure-results/history/$file" || rm -f "allure-results/history/$file"
          done

      - name: Write executor info
        run: |
          cat > allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "url": "${{ github.server_url }}/${{ github.repository }}/actions",
            "buildOrder": ${{ github.run_number }},
            "buildName": "Run #${{ github.run_number }} (${{ github.event_name }})",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/",
            "reportName": "Allure Report"
          }
          EOF

      - name: Generate merged Allure report
        run: npm run report:allure:generate

      - name: Upload merged Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ needs.test.result }}';
            const icon = result === 'success' ? '✅' : '❌';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${icon} Playwright **smoke suite** **${result}** across chromium/firefox/webkit/mobile-chrome.\n\nThe full regression suite runs on merge to \`main\` and nightly. HTML and merged Allure reports are attached to the [workflow run](${runUrl}) as artifacts.`,
            });

  deploy-pages:
    name: Publish Allure report + QA dashboard to GitHub Pages
    # Every environment's run is recorded in the dashboard history (it filters by environment, and opens on QA).
    # Note: the Allure report at the site root is whichever run published last.
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.report.result == 'success'
    # Serialize publishing: each run downloads the history file, adds itself, and re-uploads it, so overlapping runs must queue.
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    needs: [test, report]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download merged Allure report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: site

      - name: Download JSON results from all projects
        uses: actions/download-artifact@v4
        with:
          pattern: json-results-*
          path: dashboard-input

      - name: Build QA dashboard at /dashboard/
        run: |
          mkdir -p site/dashboard/data
          base="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/dashboard"
          curl -sSf "$base/data/runs.json" -o site/dashboard/data/runs.json || echo '[]' > site/dashboard/data/runs.json
          cp dashboard/index.html site/dashboard/index.html
          node scripts/build-dashboard-run.js dashboard-input run.json
          node scripts/update-dashboard-history.js run.json site/dashboard/data/runs.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  notify-slack:
    name: Notify Slack
    if: always() && github.event_name != 'pull_request' && needs.test.result != 'cancelled'
    needs: [test, deploy-pages]
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Download JSON results from all projects
        if: env.SLACK_WEBHOOK_URL != '' || (env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != '')
        uses: actions/download-artifact@v4
        with:
          pattern: json-results-*
          path: dashboard-input

      - name: Post result to Slack
        if: env.SLACK_WEBHOOK_URL != '' || (env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != '')
        env:
          REQUESTED_BY: ${{ github.event.inputs.requested_by }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/dashboard/
          ALLURE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          WORKFLOW_RESULT: ${{ needs.test.result }}
          ACTOR: ${{ github.actor }}
          SLACK_RUN_FORM: ${{ vars.SLACK_RUN_FORM }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/playwright.yml
        run: |
          node scripts/build-dashboard-run.js dashboard-input run.json
          node scripts/notify-slack.js run.json
