name: Playwright E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *' # nightly regression run, 03:00 UTC
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Override BASE_URL for this run'
        required: false
        default: ''
      grep:
        description: 'Only run tests whose title matches this pattern (overrides "suite" below)'
        required: false
        default: ''
      suite:
        description: 'Which suite to run when "grep" is not set'
        required: false
        default: full
        type: choice
        options:
          - full
          - smoke

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  BASE_URL: ${{ github.event.inputs.base_url || vars.BASE_URL || 'https://www.saucedemo.com' }}

jobs:
  test:
    name: Test (${{ matrix.project }})
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-chrome]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Determine test scope
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "grep=@smoke" >> "$GITHUB_OUTPUT"
            echo "label=smoke (PR fast gate)" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.grep }}" ]; then
            echo "grep=${{ github.event.inputs.grep }}" >> "$GITHUB_OUTPUT"
            echo "label=custom grep: ${{ github.event.inputs.grep }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.inputs.suite }}" = "smoke" ]; then
            echo "grep=@smoke" >> "$GITHUB_OUTPUT"
            echo "label=smoke (manual)" >> "$GITHUB_OUTPUT"
          else
            echo "grep=" >> "$GITHUB_OUTPUT"
            echo "label=full regression" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.project }} ${{ steps.scope.outputs.grep && format('--grep "{0}"', steps.scope.outputs.grep) || '' }}
        env:
          BASE_URL: ${{ env.BASE_URL }}

      - name: Job summary
        if: always()
        uses: daun/playwright-report-summary@v4
        with:
          report-file: test-results/results.json
          job-summary: true
          comment: false

      - name: Flaky test report
        if: always()
        run: node scripts/report-flaky.js test-results/results.json

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results/
          retention-days: 14

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-${{ matrix.project }}
          path: test-results/
          retention-days: 7

  report:
    name: Merge Allure report
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Allure results from all projects
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Fetch previous Allure history (for trend charts)
        continue-on-error: true
        run: |
          mkdir -p allure-results/history
          base_url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/history"
          for file in history.json history-trend.json categories-trend.json duration-trend.json retry-trend.json; do
            curl -sSf "$base_url/$file" -o "allure-results/history/$file" || rm -f "allure-results/history/$file"
          done

      - name: Generate merged Allure report
        run: npm run report:allure:generate

      - name: Upload merged Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ needs.test.result }}';
            const icon = result === 'success' ? '✅' : '❌';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${icon} Playwright **smoke suite** **${result}** across chromium/firefox/webkit/mobile-chrome.\n\nThe full regression suite runs on merge to \`main\` and nightly. HTML and merged Allure reports are attached to the [workflow run](${runUrl}) as artifacts.`,
            });

  deploy-pages:
    name: Publish Allure report to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: report
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download merged Allure report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
